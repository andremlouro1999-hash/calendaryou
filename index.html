<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* ═══════════ utilidades ═══════════ */
const min = h => { const [a,b]=h.split(":").map(Number); return a*60+b; };
const hhmm = m => String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(Math.round(m)%60).padStart(2,"0");
const D0 = 5*60, D1 = 24*60, SPAN = D1-D0;
const pos = m => ((Math.max(D0,Math.min(D1,m))-D0)/SPAN)*100;
const mqEscuro = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : { matches:false };
const cor = c => {
  const o = CATEGORIAS[c];
  if(!o) return mqEscuro.matches ? "#A8B5C8" : "#78889E";
  return mqEscuro.matches && o.corEscura ? o.corEscura : o.cor;
};
const rotulo = c => (CATEGORIAS[c]||{}).rotulo || c;
const DIAS = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
const CURTO = ["D","S","T","Q","Q","S","S"];
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function dur(m){
  m = Math.round(m); const h = Math.floor(m/60), r = m%60;
  if(h && r) return h+"h"+String(r).padStart(2,"0");
  if(h) return h+(h>1?" horas":" hora");
  return m+" min";
}
const isoDe = d => { const c=new Date(d); c.setMinutes(c.getMinutes()-c.getTimezoneOffset()); return c.toISOString().slice(0,10); };
const hojeISO = () => isoDe(new Date());

/* ═══════════ construtor ═══════════ */
function Dia(){
  const arr = []; let t = 0;
  const api = {
    em(h){ t = min(h); return api; },
    apartir(h){ t = Math.max(t, min(h)); return api; },
    add(d, titulo, cat, x={}){
      arr.push({ ini:hhmm(t), iniM:t, dur:d, titulo, cat, min:x.min ?? d, prio:x.prio || "importante",
        ancora:!!x.ancora, nota:x.nota || "", hab:x.hab || null, pilha:!!x.pilha,
        expediente:!!x.expediente, alvo:x.alvo || 0, almocoDur:x.almocoDur || 0 });
      t += d; return api;
    },
    ancora(h, d, titulo, cat, x={}){ t = min(h); return api.add(d, titulo, cat, {...x, ancora:true}); },
    fim(){ return arr; }
  };
  return api;
}

function montarDia(dia, modo, over){
  const P = perfil();
  const OV = over || {};   // expediente editado só hoje / só neste dia da semana
  const d = Dia();
  const tipo = modo || (P.dias[dia] === "escritorio" ? "presencial" : P.dias[dia] === "casa" ? "casa" : null);
  const pres = tipo === "presencial";
  const temPet = P.pet && P.pet.tem;
  const petNome = temPet ? (P.pet.nome || "o cachorro") : "";
  const fixosHoje = (P.fixos || []).filter(f => (f.dias||[]).includes(dia))
    .slice().sort((a,b)=>min(a.ini)-min(b.ini));
  const entradaDia = OV.entrada || ((modo || (P.dias[dia]==="escritorio"?"presencial":"casa")) === "presencial" ? P.entrada : P.entradaCasa);
  const fixosAntes = fixosHoje.filter(f => min(f.ini) < min(entradaDia));
  const fixosDepois = fixosHoje.filter(f => min(f.ini) >= min(entradaDia));
  const petNoFixo = fixosHoje.some(f => f.cat === "tolstoi");
  const proxTipo = P.dias[(dia+1)%7];

  if(!tipo) return diaLivre(d, dia, P);

  /* ───── manhã ───── */
  const petManha  = temPet ? (pres ? P.pet.manha : P.pet.manhaCasa) : 0;
  const arrumar   = pres ? P.arrumar : P.banho;
  const entrada   = OV.entrada || (pres ? P.entrada : P.entradaCasa);
  const trajeto   = pres ? P.trajeto : 0;
  const precisa   = 10 + petManha + (temPet ? P.pet.treino : 0) + arrumar + P.cafe + (temPet && pres ? 5 : 0) + trajeto;
  let acordar   = P.acordarFixo
    ? (pres ? P.acordar : P.acordarCasa)
    : hhmm(Math.max(0, min(entrada) - precisa));
  if(OV.acordar) acordar = OV.acordar;   // "mover a manhã junto" ao editar o expediente
  /* compromisso antes do trabalho puxa o despertador junto */
  if(fixosAntes.length){
    const antesPrecisa = 10 + petManha + (temPet ? P.pet.treino : 0) + arrumar + P.cafe
      + (fixosAntes[0].trajeto || 0);
    const limite = min(fixosAntes[0].ini) - antesPrecisa;
    if(limite < min(acordar)) acordar = hhmm(Math.max(3*60, limite));
  }

  d.em(acordar).add(10, "Acordar", "descanso", { prio:"essencial", min:5,
    nota: P.acordarFixo ? "" : "Calculado pra você chegar às "+entrada+" sem correr." });
  if(temPet){
    d.add(petManha, "Passeio com "+petNome, "tolstoi", { prio:"essencial", min:Math.max(20, petManha-15), hab:"passeio",
      nota: pres ? "É este passeio que segura o dia dele sozinho." : "Hoje ele fica com você: dá pra ir mais calmo." });
    if(P.pet.treino) d.add(P.pet.treino, "Treino e enriquecimento", "tolstoi",
      { min:Math.max(5, P.pet.treino-5), hab:"treino", nota:"Comandos e farejo. Curto e intenso." });
  }
  d.add(arrumar, pres ? "Banho e se arrumar" : "Banho", "casa", { prio:"essencial", min:Math.max(15, arrumar-15),
      nota: pres ? "A roupa foi separada ontem. Não reabra o guarda-roupa." : "" })
   .add(P.cafe, "Café da manhã", "casa", { min:Math.max(8, P.cafe-7) });
  fixosAntes.forEach(f=>{
    if(f.trajeto) d.add(f.trajeto, "Trajeto até "+f.titulo, "trajeto", { prio:"essencial", min:Math.max(10, f.trajeto-5) });
    d.ancora(f.ini, f.dur, f.titulo, f.cat || "curso", { prio:"essencial",
      hab: f.cat === "tolstoi" ? "adestramento" : null });
    if(f.trajeto) d.add(f.trajeto, "Volta", "trajeto", { prio:"essencial", min:Math.max(10, f.trajeto-5) });
  });
  if(temPet && pres) d.add(5, "Deixar "+petNome+" pronto", "tolstoi", { prio:"essencial", min:5,
      nota:"Brinquedo recheado, água, ventilador." });
  if(trajeto) d.add(trajeto, "Trajeto até o trabalho", "trajeto", { prio:"essencial", min:Math.max(10, trajeto-5) });

  /* ───── trabalho: uma janela (entrada → saída) com uma carga a cumprir.
     Os blocos reais são calculados depois, contornando o que for fixo no meio. ───── */
  const almoco  = OV.almoco !== undefined ? OV.almoco : (pres ? P.almoco : P.almocoCasa);
  const horas   = OV.horas || P.horas;
  /* a janela é exatamente entrada → saída: horas de trabalho + almoço.
     (antes somava 60 min fixos, ignorando o almoço configurado) */
  const saida   = min(entrada) + Math.round(horas*60) + almoco;
  d.ancora(entrada, saida - min(entrada), "Trabalho", "trabalho",
    { prio:"essencial", expediente:true, alvo:Math.round(horas*60), almocoDur:almoco });

  /* ───── noite ───── */
  if(pres) d.add(P.trajeto, "Trajeto de volta", "trajeto", { prio:"essencial", min:Math.max(10, P.trajeto-5) })
            .add(15, "Chegar e trocar de roupa", "casa", { min:10 });
  else if(fixosDepois.length) d.add(15, "Pausa e trocar de roupa", "casa", { prio:"opcional", min:8 });

  fixosDepois.forEach(f=>{
    if(f.trajeto) d.add(f.trajeto, "Trajeto até "+f.titulo, "trajeto", { prio:"essencial", min:Math.max(10, f.trajeto-5) });
    else d.add(20, "Preparar pra "+f.titulo, "casa", { prio:"opcional", min:10, nota:"É aqui em casa — sem correria." });
    d.ancora(f.ini, f.dur, f.titulo, f.cat || "curso", { prio:"essencial",
      hab: f.cat === "tolstoi" ? "adestramento" : null });
    if(f.trajeto) d.add(f.trajeto, "Volta pra casa", "trajeto", { prio:"essencial", min:Math.max(10, f.trajeto-5) });
  });

  if(temPet && !petNoFixo){
    const petNoite = pres ? P.pet.noite : P.pet.noiteCasa;
    d.add(petNoite, "Passeio da noite", "tolstoi", { prio:"essencial", min:Math.max(20, petNoite-20), hab:"passeio2",
      nota: pres ? "É o que compra uma noite tranquila de sono." : "Ele ficou com você o dia todo." });
  }
  d.add(P.jantar, "Jantar", "casa", { min:Math.max(20, P.jantar-15) })
   .add(P.reset, "Reset da casa", "casa", { min:10, hab:"reset",
      nota:"Cronômetro: louça e superfícies. Só isso." });

  if(P.estudo && P.estudo.tem && (P.estudo.dias||[]).includes(dia))
    d.add(P.estudo.dur, P.estudo.titulo+" — bloco 1", "mestrado",
        { min:Math.max(20, Math.round(P.estudo.dur/2)), hab:"mestrado",
          nota:"Meta mínima: metade do tempo sentado. Se render, emenda." })
     .add(P.estudo.dur, P.estudo.titulo+" — bloco 2", "mestrado", { prio:"opcional", min:20 });
  else if((P.pessoas.dias||[]).includes(dia))
    d.add(P.pessoas.dur, "Tempo com quem importa", "pessoas", { min:Math.max(30, P.pessoas.dur-35),
        nota:"Isto é compromisso, não sobra do dia." })
     .add(20, "Uma coisa da Pilha", "organizacao", { prio:"opcional", min:10, pilha:true });
  else
    d.add(60, "Livre", "descanso", { prio:"opcional", min:20 });

  d.add(15, "Kit de amanhã", "organizacao", { min:10, hab:"kit",
      nota: proxTipo === "escritorio" ? "Roupa separada. Amanhã é dia de escritório." : "Deixe o amanhã meio pronto." })
   .add(25, "Dormir", "descanso", { prio:"essencial", min:15,
      nota:"Alvo: na cama às "+P.dormir+"." });
  return d.fim();
}

/* dias sem trabalho: fim de semana ou folga */
function diaLivre(d, dia, P){
  const temPet = P.pet && P.pet.tem;
  const petNome = temPet ? (P.pet.nome || "o cachorro") : "";
  const fixosHoje = (P.fixos || []).filter(f => (f.dias||[]).includes(dia))
    .slice().sort((a,b)=>min(a.ini)-min(b.ini));
  let inicio = P.acordarFds;
  if(fixosHoje.length){
    const precisaAntes = 15 + (temPet ? P.pet.longo : 0) + 30 + (fixosHoje[0].trajeto || 0);
    const limite = min(fixosHoje[0].ini) - precisaAntes;
    if(limite < min(inicio)) inicio = hhmm(Math.max(4*60, limite));
  }

  d.em(inicio).add(15, "Acordar sem alarme", "descanso", { min:10 });
  if(temPet) d.add(P.pet.longo, "Passeio longo com "+petNome, "tolstoi",
    { prio:"essencial", min:Math.max(30, P.pet.longo-30), hab:"passeio",
      nota:"O passeio da semana. Cansa ele de verdade." });
  d.add(30, "Café da manhã", "casa", { min:20 });
  fixosHoje.filter(f=>min(f.ini) < 12*60).forEach(f=>{
    if(f.trajeto) d.add(f.trajeto, "Trajeto até "+f.titulo, "trajeto", { prio:"essencial", min:Math.max(10, f.trajeto-5) });
    d.ancora(f.ini, f.dur, f.titulo, f.cat || "curso", { prio:"essencial" });
    if(f.trajeto) d.add(f.trajeto, "Volta", "trajeto", { prio:"essencial", min:Math.max(10, f.trajeto-5) });
  });

  if(P.estudo && P.estudo.tem && (P.estudo.dias||[]).includes(dia))
    d.add(P.estudo.dur, P.estudo.titulo+" — bloco 1", "mestrado",
        { min:Math.max(20, Math.round(P.estudo.dur/2)), hab:"mestrado",
          nota:"Melhor horário da semana pra isso: cabeça limpa." })
     .add(10, "Pausa", "descanso", { prio:"opcional", min:5 })
     .add(P.estudo.dur, P.estudo.titulo+" — bloco 2", "mestrado", { prio:"opcional", min:20 });

  d.apartir("12:00").add(60, "Almoço", "casa", { min:40 });
  if(P.faxina && P.faxina.dia === dia)
    d.add(P.faxina.dur, "Faxina da semana", "casa", { min:Math.max(30, Math.round(P.faxina.dur/2)), hab:"faxina",
      nota:"Cronômetro e playlist. Uma área por vez." });
  if(P.prep && P.prep.dia === dia)
    d.add(P.prep.dur, "Prep da semana", "organizacao", { prio:"essencial", min:Math.max(45, Math.round(P.prep.dur*0.6)), hab:"prep",
      nota:"Comida, roupa passada e o que evita correria de manhã." });
  d.add(30, "Uma coisa da Pilha", "organizacao", { prio:"opcional", min:15, pilha:true })
   .add(180, "Livre — rua, gente, descanso", "pessoas", { prio:"opcional", min:45 });

  fixosHoje.filter(f=>min(f.ini) >= 12*60).forEach(f=>{
    if(f.trajeto) d.add(f.trajeto, "Trajeto até "+f.titulo, "trajeto", { prio:"essencial", min:Math.max(10, f.trajeto-5) });
    d.ancora(f.ini, f.dur, f.titulo, f.cat || "curso", { prio:"essencial" });
    if(f.trajeto) d.add(f.trajeto, "Volta pra casa", "trajeto", { prio:"essencial", min:Math.max(10, f.trajeto-5) });
  });

  if(temPet && !fixosHoje.some(f=>f.cat==="tolstoi"))
    d.apartir("18:15").add(Math.max(30, P.pet.noiteCasa), "Passeio da noite", "tolstoi",
      { prio:"essencial", min:25, hab:"passeio2" });
  d.apartir("19:30").add(60, "Jantar", "casa", { min:30 });
  if(P.prep && P.prep.dia === dia)
    d.add(15, "Planejar a semana", "organizacao", { min:10,
      nota:"Abra a Pilha e escolha 3 coisas. Não mais que 3." });
  d.add(90, "Filme, série, nada", "descanso", { prio:"opcional", min:30 })
   .add(15, "Kit de amanhã", "organizacao", { min:10, hab:"kit" })
   .add(30, "Dormir", "descanso", { prio:"essencial", min:20,
      nota:"Alvo: na cama às "+P.dormirFds+"." });
  return d.fim();
}

/* ═══════════ armazenamento ═══════════ */
const CHAVE = "rotina:tolstoi:v3";
const Store = {
  async carregar(){
    try{ if(window.storage){ const r = await window.storage.get(CHAVE); if(r && r.value) return JSON.parse(r.value); } }catch(e){}
    try{ const s = localStorage.getItem(CHAVE); if(s) return JSON.parse(s); }catch(e){}
    return null;
  },
  async salvar(d){
    const txt = JSON.stringify(d);
    try{ if(window.storage){ await window.storage.set(CHAVE, txt); } }catch(e){}
    try{ localStorage.setItem(CHAVE, txt); }catch(e){}
    Nuvem.empurrar(d);          // o aparelho nunca espera a rede pra ter os dados
  }
};

/* ═══════════════════════════════════════════════════════════════
   NUVEM — mesmo dia no celular e no PC.
   O aparelho é sempre a fonte imediata: a nuvem chega depois e
   se funde. Se a rede não existir, o app funciona igual.
   ═══════════════════════════════════════════════════════════════ */
const CHAVE_CFG = "calendaryou:firebase";
/* A configuração pode vir de dois lugares: colada dentro do app (o caminho de
   quem monta tudo pelo celular) ou escrita no topo do arquivo. A colada manda. */
function configNuvem(){
  try{
    const s = localStorage.getItem(CHAVE_CFG);
    if(s){ const o = JSON.parse(s); if(o && o.apiKey) return o; }
  }catch(e){}
  if(typeof FIREBASE_CONFIG !== "undefined" && FIREBASE_CONFIG.apiKey &&
     FIREBASE_CONFIG.apiKey.indexOf("COLE") !== 0) return FIREBASE_CONFIG;
  return null;
}
/* Lê o bloco que o console do Firebase manda copiar, em qualquer formato:
   com const, sem const, JSON puro, com ou sem aspas nas chaves. */
function lerConfigColada(txt){
  const campos = ["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId"];
  const o = {};
  campos.forEach(k=>{
    const m = String(txt).match(new RegExp('["\']?'+k+'["\']?\\s*[:=]\\s*["\']([^"\']+)["\']'));
    if(m) o[k] = m[1];
  });
  if(!o.apiKey || !o.projectId || !o.appId) return null;
  if(!o.authDomain) o.authDomain = o.projectId + ".firebaseapp.com";
  return o;
}

const Nuvem = {
  pronto:false, usuario:null, estado:"desligado", ultimoErro:"",
  sincronizado:false, pendente:null, ultimoEnviado:null, persistencia:"?",

  configurada(){ return !!configNuvem(); },
  sdkCarregado(){ return typeof firebase !== "undefined" && !!firebase.auth; },

  async iniciar(){
    const cfg = configNuvem();
    if(!cfg){ this.estado = "desligado"; return; }
    if(!this.sdkCarregado()){
      this.estado = "sem-sdk";
      this.ultimoErro = "O Firebase não carregou. Normalmente é falta de internet na abertura.";
      return;
    }
    try{
      firebase.initializeApp(cfg);
      this.db = firebase.firestore();
      /* A sessão precisa sobreviver a fechar o app. Se o navegador não deixar
         guardar (aba anônima, armazenamento bloqueado), é isso que faz você
         ser desconectado sozinho — então dizemos, em vez de deixar quieto. */
      try{
        await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
        this.persistencia = "local";
      }catch(e){
        this.persistencia = "nenhuma";
        this.ultimoErro = "Este navegador não deixa guardar a sessão, então você "+
          "vai precisar entrar de novo a cada abertura.";
      }
      /* o modo offline é um extra: se ele falhar ou demorar, o login não pode
         ficar esperando por ele */
      this.pronto = true;
      this.estado = "deslogado";
      this.db.enablePersistence({synchronizeTabs:true}).catch(()=>{});

      firebase.auth().onAuthStateChanged(u=>{
        this.usuario = u;
        if(u){ this.estado = "ligado"; this.escutar(); }
        else { this.estado = "deslogado"; this.sincronizado = false; this.ultimoEnviado = null;
               if(this.parar){ this.parar(); this.parar = null; } }
        if(typeof atualizarSeloNuvem === "function") atualizarSeloNuvem();
      });
    }catch(e){
      this.estado = "erro";
      this.ultimoErro = String((e && e.message) || e);
    }
  },

  ref(){ return this.usuario && this.db ? this.db.collection("rotinas").doc(this.usuario.uid) : null; },

  escutar(){
    const r = this.ref(); if(!r) return;
    if(this.parar) this.parar();
    this.sincronizado = false;
    this.parar = r.onSnapshot(snap=>{
      const primeiro = !this.sincronizado;
      this.sincronizado = true;
      const remoto = snap.data();
      /* hasPendingWrites marca o eco da nossa própria gravação. É esse o sinal
         certo pra ignorar — o contador que eu usava antes engolia, de vez em
         quando, uma atualização de verdade vinda do outro aparelho. */
      if(remoto && remoto.json && !snap.metadata.hasPendingWrites){
        let vindo = null;
        try{ vindo = JSON.parse(remoto.json); }catch(e){}
        if(vindo && fundir(vindo)){
          try{ localStorage.setItem(CHAVE, JSON.stringify(dados)); }catch(e){}
          render();
        }
      }
      if(primeiro){
        /* Só agora sabemos o que existe na nuvem. Mandar antes disso era o que
           fazia um aparelho recém-ligado passar por cima do outro. */
        const eu = dados._t || 0, la = (remoto && remoto._t) || 0;
        if(!snap.exists || eu > la) this.empurrar(dados);
        else this.pendente = null;
      }
      if(typeof atualizarSeloNuvem === "function") atualizarSeloNuvem();
    }, err=>{
      this.estado = "erro";
      this.ultimoErro = String((err && err.message) || err);
      if(typeof atualizarSeloNuvem === "function") atualizarSeloNuvem();
    });
  },

  empurrar(d){
    const r = this.ref(); if(!r) return;
    if(!this.sincronizado){ this.pendente = d; return; }   // ainda não conheço a nuvem
    const json = JSON.stringify(d);
    if(json === this.ultimoEnviado) return;                // nada novo: evita ping-pong
    this.ultimoEnviado = json;
    r.set({ json:json, _t: d._t || Date.now() })
     .catch(e=>{
       this.ultimoEnviado = null;
       this.ultimoErro = String((e && e.message) || e);
       if(typeof atualizarSeloNuvem === "function") atualizarSeloNuvem();
     });
  },

  async entrar(email, senha, criar){
    if(!this.configurada()) throw new Error("Falta colar a configuração do Firebase.");
    if(!this.sdkCarregado()) throw new Error("O Firebase não carregou. Verifique a internet e recarregue a página.");
    if(!this.pronto) throw new Error(this.ultimoErro || "A nuvem não conseguiu iniciar.");
    if(criar) await firebase.auth().createUserWithEmailAndPassword(email, senha);
    else await firebase.auth().signInWithEmailAndPassword(email, senha);
  },
  async sair(){ if(this.pronto) await firebase.auth().signOut(); }
};

/* Funde o que veio da nuvem com o que já está aqui.
   Dia a dia: vence quem foi mexido por último naquele dia — assim um dia
   marcado no celular não é apagado por um PC que ficou aberto sem uso.
   O resto (perfil, pilha, fixos) segue o carimbo geral mais recente. */
function fundir(remoto){
  if(!remoto || typeof remoto !== "object") return false;
  let mudou = false;
  const rReg = remoto.registro || {}, lReg = dados.registro || {};
  Object.keys(rReg).forEach(iso=>{
    const r = rReg[iso], l = lReg[iso];
    if(!l){ lReg[iso] = r; mudou = true; return; }
    if((r._t || 0) > (l._t || 0)){ lReg[iso] = r; mudou = true; }
  });
  dados.registro = lReg;

  if((remoto._t || 0) > (dados._t || 0)){
    ["pilha","extras"].forEach(k=>{ if(remoto[k]){ dados[k] = remoto[k]; mudou = true; } });
    ["mudancas","cancelamentos","agenda","dourados","expedientes"].forEach(k=>{
      if(remoto[k]){ dados[k] = remoto[k]; mudou = true; } });
    if(remoto.perfil){ dados.perfil = remoto.perfil; MODO_PADRAO = calcModos(); GRANA = perfil().grana; mudou = true; }
    dados._t = remoto._t;
  }
  return mudou;
}
let dados = { registro:{}, pilha:[], extras:[], mudancas:{}, cancelamentos:{}, agenda:{}, dourados:{}, expedientes:{}, tutorial:false };
let salvando = null, pendente = false;
/* carimba o dia mexido: é isso que deixa a fusão entre celular e PC saber
   qual das duas versões daquele dia é a mais recente */
function salvar(iso){
  const alvo = iso || hojeISO();
  if(dados.registro[alvo]) dados.registro[alvo]._t = Date.now();
  dados._t = Date.now();
  pendente = true;
  clearTimeout(salvando);
  salvando = setTimeout(()=>{ pendente = false; Store.salvar(dados); }, 300);
}
/* fechar o app não pode comer os últimos 300 ms de alterações */
function descarregar(){
  if(!pendente) return;
  clearTimeout(salvando); pendente = false;
  Store.salvar(dados);
}
addEventListener("pagehide", descarregar);
addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "hidden") descarregar(); });
function regDe(iso, dow){
  const r = dados.registro[iso] || (dados.registro[iso] = {});
  if(!r.feitos) r.feitos = [];
  if(r.replanEm === undefined) r.replanEm = null;
  if(!r.resgatados) r.resgatados = [];
  if(!r.metas) r.metas = [];
  if(r.grana === undefined) r.grana = false;
  if(!r.ajustes) r.ajustes = {};
  if(!r.cancelados) r.cancelados = [];
  if(!r.especiais) r.especiais = [];
  if(!r.imprevistos) r.imprevistos = [];
  if(!r.encaixes) r.encaixes = [];
  if(!r.ouroHoje) r.ouroHoje = [];
  if(!r.pilhados) r.pilhados = [];
  if(r.modo === undefined) r.modo = MODO_PADRAO[dow];
  return r;
}
const modoDe = (iso, dow) => (dados.registro[iso] || {}).modo || MODO_PADRAO[dow];

/* ═══════════ plano do dia (extras, mudanças e cancelamentos) ═══════════ */
/* Empurra os blocos livres pra encostarem na próxima âncora, em vez de
   deixar um buraco parado no começo do dia quando algo é cancelado. */
function alinharAoFim(arr){
  let i = 0;
  while(i < arr.length){
    if(arr[i].ancora){ i++; continue; }
    let j = i; while(j < arr.length && !arr[j].ancora) j++;
    if(j >= arr.length) break;            // trecho final da noite fica como está
    const seg = arr.slice(i,j);
    const ult = seg[seg.length-1];
    const folga = arr[j].iniM - (ult.iniM + ult.dur);
    if(folga > 0) seg.forEach(b=>{ b.iniM += folga; b.ini = hhmm(b.iniM); });
    i = j;
  }
}

/* um ajuste pode mudar a hora, a duração, ou as duas */
const normAjuste = v => !v ? null : (typeof v === "string" ? { ini:v } : v);

/* expediente editado: o de hoje (registro) manda sobre o do dia da semana (expedientes) */
const chaveExp = (dia, modo) => dia+":"+(modo || "");
function expedienteDe(dia, modo, iso){
  const semana = (dados.expedientes || {})[chaveExp(dia, modo)] || {};
  const hoje = iso ? ((dados.registro[iso] || {}).expediente || {}) : {};
  return Object.assign({}, semana, hoje);
}

function blocosCrus(dia, modo, iso){
  const cont = {};
  /* a rotina sai em ordem narrativa (acordar → ... → dormir) e essa ordem é a verdade */
  const arr = montarDia(dia, modo, expedienteDe(dia, modo, iso)).map(b=>{
    const s = slug(b.titulo); cont[s] = (cont[s]||0)+1;
    return {...b, id: dia+":"+s+cont[s], sono: b.titulo === "Dormir" };
  });
  /* insere um grupo de blocos (preparo → trajeto → evento → volta) no ponto certo.
     Se o grupo cair no meio de outro bloco (uma consulta no meio do expediente),
     esse bloco é partido em dois em vez de sumir. */
  function inserirGrupo(grupo){
    if(!grupo.length) return;
    const ini = grupo[0].iniM;
    const ult = grupo[grupo.length-1];
    const fim = ult.iniM + ult.dur;
    const idx = arr.findIndex(b => b.iniM <= ini && b.iniM + b.dur > ini && !b.ancora);
    if(idx >= 0){
      const B = arr[idx];
      const antes = ini - B.iniM, depois = (B.iniM + B.dur) - fim;
      if(antes >= 15 || depois >= 15){          // sobra pedaço que vale a pena manter
        const novos = [];
        if(antes >= 15) novos.push({...B, dur:antes, min:Math.min(B.min, antes)});
        novos.push(...grupo);
        if(depois >= 15) novos.push({...B, id:B.id+"-b", iniM:fim, ini:hhmm(fim),
          dur:depois, min:Math.min(B.min, depois), nota:"" });
        arr.splice(idx, 1, ...novos);
      }else{                                     // partir só destruiria o bloco: entra ao lado
        arr.splice(antes <= depois ? idx : idx+1, 0, ...grupo);
      }
      return;
    }
    let i = arr.findIndex(b => b.iniM > ini);
    if(i < 0) i = Math.max(0, arr.length - 1);
    arr.splice(i, 0, ...grupo);
  }

  const grupos = [];
  dados.extras.filter(e=>e.dia===dia).forEach(e=>{
    grupos.push([{ ini:e.ini, iniM:min(e.ini), dur:e.dur, titulo:e.titulo, cat:e.cat||"curso",
      min:e.dur, prio:"essencial", ancora:true, nota:e.nota||"", hab:null, pilha:false, id:e.id, extra:true }]);
  });
  if(iso) ((dados.registro[iso] || {}).especiais || []).forEach(e=>{
    const t = e.trajeto || 0, prep = e.preparo || 0, base = min(e.ini), g = [];
    const notaBase = e.inicioEvento && e.inicioEvento !== e.ini
      ? "Começa "+e.inicioEvento+"; você chega "+e.ini+"." : "Evento do dia — tudo se organiza em volta.";
    if(prep) g.push({ ini:hhmm(base-t-prep), iniM:base-t-prep, dur:prep, titulo:"Se arrumar pra "+e.titulo,
      cat:"casa", min:Math.max(10, Math.round(prep*0.6)), prio:"importante", ancora:false, nota:"",
      hab:null, pilha:false, id:e.id+"p" });
    if(t) g.push({ ini:hhmm(base-t), iniM:base-t, dur:t, titulo:"Trajeto até "+e.titulo,
      cat:"trajeto", min:t, prio:"essencial", ancora:true, nota:"Sair de casa nesta hora.",
      hab:null, pilha:false, id:e.id+"t" });
    g.push({ ini:e.ini, iniM:base, dur:e.dur, titulo:e.titulo, cat:e.cat || "pessoas",
      min: e.ouro ? e.dur : Math.max(20, Math.round(e.dur*0.6)), prio:"essencial", ancora:true,
      nota:notaBase + (e.estimado ? " Duração estimada." : ""), hab:null, pilha:false,
      id:e.id, especial:true, dourado:!!e.ouro,
      inicioReal: min(e.inicioEvento || e.ini) });
    if(t) g.push({ ini:hhmm(base+e.dur), iniM:base+e.dur, dur:t, titulo:"Volta pra casa",
      cat:"trajeto", min:Math.max(10, t-10), prio:"essencial", ancora:false, nota:"",
      hab:null, pilha:false, id:e.id+"v" });
    grupos.push(g);
  });
  if(iso) ((dados.registro[iso] || {}).encaixes || []).forEach(e=>{
    grupos.push([{ ini:e.ini, iniM:min(e.ini), dur:e.dur, titulo:e.titulo, cat:e.cat || "organizacao",
      min: e.fixo ? e.dur : Math.max(10, Math.round(e.dur*0.6)),
      prio: e.fixo ? "essencial" : "importante",
      ancora:true,                       // você escolheu a hora: ela vale
      nota:"Só hoje.", hab:null, pilha:false, id:e.id, encaixe:true }]);
  });
  if(iso) ((dados.registro[iso] || {}).imprevistos || []).forEach(e=>{
    grupos.push([{ ini:e.ini, iniM:min(e.ini), dur:e.dur, titulo:e.titulo, cat:"imprevisto",
      min:e.dur, prio:"essencial", ancora:true,
      nota: e.encerrado
        ? "Resolvido às "+(e.fimReal || hhmm(min(e.ini)+e.dur))+". Durou "+dur(e.dur)+"."
        : (e.desc || "Imprevisto — o dia se reorganiza em volta."),
      hab:null, pilha:false, id:e.id, urgente:true, dourado:true, encerrado:!!e.encerrado }]);
  });
  grupos.sort((a,b)=>a[0].iniM - b[0].iniM).forEach(inserirGrupo);
  return arr;
}

function planoBase(dia, modo, iso){
  const reg0 = iso ? (dados.registro[iso] || {}) : {};
  let arr = blocosCrus(dia, modo, iso);
  let mexeu = true;

  const canc = new Set([ ...(reg0.cancelados || []),
    ...Object.keys(dados.cancelamentos || {}).filter(k=>dados.cancelamentos[k]) ]);
  const fora = arr.filter(b=>canc.has(b.id))
    .map(b=>({...b, soHoje:(reg0.cancelados||[]).includes(b.id)}));
  arr = arr.filter(b=>!canc.has(b.id));

  const ajustesDia = reg0.ajustes || {};
  arr = arr.map(b=>{
    const aj = normAjuste(ajustesDia[b.id]), perm = normAjuste(dados.mudancas[b.id]);
    const f = aj || perm;
    if(!f) return b;
    mexeu = true;
    const novoDur = f.dur || b.dur;
    const t = f.ini ? min(f.ini) : b.iniM;
    return {...b, iniM:t, ini:hhmm(t), dur:novoDur, titulo: f.titulo || b.titulo,
      min: f.dur ? novoDur : Math.min(b.min, novoDur),
      ancora: b.ancora || !!f.ini, movido:true, movidoSempre: !aj && !!perm };
  });
  /* num imprevisto, nada é inegociável a não ser o próprio imprevisto:
     quando é urgente de verdade, o resto cede — inclusive o que tem estrela */
  const urg = (reg0.imprevistos || []).slice().sort((a,b)=>min(a.ini)-min(b.ini))[0];
  const ouroDia = new Set(reg0.ouroHoje || []);
  arr = arr.map(b => {
    if(b.urgente) return {...b, min:b.dur, prio:"essencial", dourado:true};
    const temEstrela = (dados.dourados && dados.dourados[b.id]) || b.dourado || ouroDia.has(b.id);
    if(!temEstrela) return b;
    if(urg && b.iniM + b.dur > min(urg.ini)) return {...b, dourado:false, estrelaSuspensa:true};
    return {...b, min:b.dur, prio:"essencial", dourado:true};
  });

  /* o imprevisto passa por cima de tudo: o que for horário fixo é atrasado ou perdido,
     e o app diz qual foi o estrago em vez de mandar você escolher */
  const impactos = [];
  (reg0.imprevistos || []).forEach(im=>{
    const iIni = min(im.ini), iFim = iIni + im.dur;
    const marcador = impactos.length;      // só mexe no que este imprevisto causou
    const perdidosIds = [];
    arr = arr.filter(b=>{
      if(b.urgente || !b.ancora || b.expediente) return true;
      const fimB = b.iniM + b.dur;
      if(!(b.iniM < iFim && fimB > iIni)) return true;   // não encosta
      if(fimB <= iFim + 10){                              // acaba antes de você se livrar
        impactos.push({ titulo:b.titulo, perdido:true, ini:b.ini, fim:hhmm(fimB) });
        perdidosIds.push(b.id);
        return false;
      }
      return true;
    });
    if(perdidosIds.length) arr = arr.filter(b=>
      !perdidosIds.some(id => b.id !== id && b.id.indexOf(id) === 0));
    arr = arr.map(b=>{
      if(b.urgente || !b.ancora || b.expediente) return b;
      const fimB = b.iniM + b.dur;
      if(b.iniM < iFim && fimB > iFim){
        const traj = arr.find(x => x.id === b.id+"t");
        const t = traj ? traj.dur : 0;
        const novo = Math.min(iFim + t, fimB - 10);      // sai da emergência e ainda viaja
        impactos.push({ id:b.id, titulo:b.titulo, atraso:novo - b.iniM, novoIni:hhmm(novo),
          eraIni:b.ini, fim:hhmm(fimB), sobra:fimB - novo, saida:iFim, trajeto:t });
        return {...b, iniM:novo, ini:hhmm(novo), dur:fimB - novo,
          min:Math.min(b.min, fimB - novo), atrasadoPor:novo - b.iniM };
      }
      return b;
    });
    /* o preparo perdeu o sentido e o trajeto passa a sair de onde você está */
    impactos.slice(marcador).filter(i=>i.id).forEach(i=>{
      arr = arr.filter(x => x.id !== i.id+"p");
      if(i.trajeto) arr = arr.map(x => x.id === i.id+"t"
        ? {...x, iniM:i.saida, ini:hhmm(i.saida), nota:"Sair direto de onde você estiver." } : x);
      /* e o evento agora vem depois da emergência, não antes */
      const ids = [i.id+"t", i.id, i.id+"v"];
      const movidos = arr.filter(x => ids.indexOf(x.id) >= 0);
      arr = arr.filter(x => ids.indexOf(x.id) < 0);
      const k = arr.findIndex(x => x.id === im.id);
      arr.splice(k >= 0 ? k+1 : arr.length, 0, ...movidos);
    });
  });
  /* depois de um imprevisto o dia vira colcha de retalhos (blocos partidos, âncoras
     empurradas). Aqui a ordem do relógio passa a valer, senão pedaço fica fora de lugar. */
  if((reg0.imprevistos || []).length) arr.sort((a,b)=>a.iniM - b.iniM);
  /* agenda do trabalho: se os compromissos passam da saída, o trabalho estica
     e a noite inteira anda junto */
  const eventos = iso ? ((dados.agenda || {})[iso] || []) : [];
  let atraso = 0, conflitos = [], fimAgenda = 0;
  if(eventos.length){
    fimAgenda = Math.max(...eventos.map(e=>min(e.fim)));
    const E = arr.find(b=>b.expediente);
    if(E){
      const fimJanela = E.iniM + E.dur;
      if(fimAgenda > fimJanela){
        atraso = fimAgenda - fimJanela;
        conflitos = arr.filter(b=>b.ancora && !b.expediente && b.iniM >= fimJanela && b.iniM < fimAgenda)
          .map(b=>({titulo:b.titulo, ini:b.ini}));
        E.dur += atraso;
        mexeu = true;
      }
    }
  }

  /* um almoço movido à mão precisa chegar até aqui, senão a mudança seria ignorada */
  const idAlm = dia+":almoco1";
  const ajAlmoco = normAjuste((reg0.ajustes || {})[idAlm]) || normAjuste((dados.mudancas || {})[idAlm]);
  /* o expediente decide a que horas você chega ao trabalho olhando o que vem
     antes dele. "Antes" precisa ser antes no relógio, não antes na lista: sem
     isto, um bloco movido para a tarde adiaria a chegada para a tarde. */
  arr.sort(porHorario);
  const trabalho = expandirExpediente(arr, dia, ajAlmoco);

  let naoCoube = [], estouro = null;
  if(arr.length){
    const { plano, ajustes } = normalizar(arr);
    estouro = ajustes.find(a=>a.tipo === "estouro") || null;
    naoCoube = plano.filter(b=>b.adiado).map(b=>({...b, dur2:undefined, ini2:undefined}));
    arr = plano.filter(b=>!b.adiado).map(b=>{
      const t = b.ini2 === null ? b.iniM : b.ini2;
      return {...b, iniM:t, ini:hhmm(t), dur:b.dur2, ini2:undefined, dur2:undefined, adiado:false};
    });
    if(fora.length) alinharAoFim(arr);
  }

  /* a hora de dormir é o que sobra do dia — a nota compara com o alvo do perfil */
  const P = perfil();
  const sonoB = arr.find(b=>b.sono);
  if(sonoB){
    const alvoStr = P.dias[dia] === "folga" ? P.dormirFds : P.dormir;
    const dif = sonoB.iniM - min(alvoStr);
    sonoB.nota = dif === 0 ? "Bem no horário que você definiu ("+alvoStr+")."
      : dif < 0 ? "Você ganhou "+dur(-dif)+": dá pra deitar antes do seu alvo, que era "+alvoStr+"."
      : dur(dif)+" além do seu alvo, que era "+alvoStr+".";
  }
  /* dois horários fixos em cima um do outro: o app não escolhe por você */
  const anc = arr.filter(b=>b.ancora).slice().sort((a,b)=>a.iniM-b.iniM);
  const choques = [];
  for(let k=1;k<anc.length;k++)
    if(anc[k].iniM < anc[k-1].iniM + anc[k-1].dur) choques.push([anc[k-1], anc[k]]);

  return { blocos:arr, fora, atraso, conflitos, eventos, fimAgenda, naoCoube, estouro, choques, impactos, trabalho };
}

function blocosDoDia(dia, modo, iso){ return planoBase(dia, modo, iso).blocos; }

/* ═══════════ replanejamento ═══════════ */
/* coloca a fila em sequência a partir de um instante: âncoras não se mexem,
   opcionais caem primeiro, o resto encolhe até o mínimo, a hora de dormir é teto */
function fluir(fila, cursor){
  const ajustes = [];
  let i = 0;
  while(i < fila.length){
    if(fila[i].ancora){ fila[i].ini2 = fila[i].iniM; cursor = Math.max(cursor, fila[i].iniM + fila[i].dur); i++; continue; }
    if(fila[i].sono){ fila[i].ini2 = cursor; cursor += fila[i].dur2; i++; continue; }
    let j = i; while(j < fila.length && !fila[j].ancora && !fila[j].sono) j++;
    let limite = Infinity, tetoEstourado = false;
    if(j < fila.length){
      limite = fila[j].iniM;
      /* se um compromisso já empurrou o dia além da hora de dormir, o teto perde o sentido —
         mas aí só o essencial continua: ninguém vai fazer faxina às 3 da manhã */
      if(fila[j].sono && cursor >= limite){ limite = Infinity; tetoEstourado = true; }
    }
    const seg = fila.slice(i,j);
    let precisa = seg.reduce((s,b)=>s+b.dur2,0);
    if(tetoEstourado){
      seg.forEach(b=>{
        if(b.prio !== "essencial" && !b.resgatado && !b.dourado && !b.adiado){
          b.adiado = true; ajustes.push({tipo:"adiado",titulo:b.titulo});
        }
      });
      precisa = seg.filter(b=>!b.adiado).reduce((s,b)=>s+b.dur2,0);
    }
    const disp = limite - cursor;
    if(precisa > disp){
      for(let k=seg.length-1;k>=0 && precisa>disp;k--){
        if(seg[k].prio === "opcional" && !seg[k].resgatado){
          seg[k].adiado = true; precisa -= seg[k].dur2; ajustes.push({tipo:"adiado",titulo:seg[k].titulo});
        }
      }
      const ativos = seg.filter(b=>!b.adiado);
      if(precisa > disp){
        const minTotal = ativos.reduce((s,b)=>s+b.min,0);
        const folga = precisa - minTotal, excesso = precisa - disp;
        const fator = folga > 0 ? Math.min(1, excesso/folga) : 0;
        ativos.forEach(b=>{
          const corte = Math.round((b.dur2-b.min)*fator/5)*5;
          if(corte > 0){ b.dur2 -= corte; b.cortado = corte; ajustes.push({tipo:"encurtado",titulo:b.titulo,min:corte}); }
        });
        precisa = ativos.reduce((s,b)=>s+b.dur2,0);
      }
      for(let k=ativos.length-1;k>=0 && precisa>disp;k--){
        if(ativos[k].prio !== "essencial" && !ativos[k].adiado && !ativos[k].resgatado){
          ativos[k].adiado = true; precisa -= ativos[k].dur2; ajustes.push({tipo:"adiado",titulo:ativos[k].titulo});
        }
      }
      /* nem no mínimo coube. Se o que vem depois é um horário fixo de verdade, tira do fim
         até caber. Se o teto é só a hora de dormir, a noite escorrega — voltar pra casa
         não pode sumir do dia. */
      const tetoEhSono = j < fila.length && fila[j].sono;
      if(precisa > disp && limite !== Infinity && !tetoEhSono){
        const faltava = precisa - disp;
        for(let k=ativos.length-1;k>=0 && precisa>disp;k--){
          if(!ativos[k].adiado && !ativos[k].dourado){
            ativos[k].adiado = true; precisa -= ativos[k].dur2;
            ajustes.push({tipo:"adiado",titulo:ativos[k].titulo});
          }
        }
        ajustes.push({tipo:"estouro", min:faltava, titulo:fila[j].titulo, hora:hhmm(limite)});
      }
    }
    seg.forEach(b=>{ if(b.adiado){ b.ini2 = null; return; } b.ini2 = cursor; cursor += b.dur2; });
    i = j;
  }
  return ajustes;
}

/* encaixa o dia inteiro em sequência — nada é tratado como "já passou" */
/* A ordem em que os blocos entram na fila é a ordem em que o motor os empilha.
   Mover um bloco muda a ordem do dia — sem reordenar aqui, ele continuaria
   valendo como parede no lugar antigo e engoliria tudo que viesse depois.
   Num dia sem nada movido isto não muda nada: a rotina já nasce em ordem. */
function porHorario(a, b){
  return a.iniM - b.iniM || (a.ancora ? 0 : 1) - (b.ancora ? 0 : 1);
}

function normalizar(blocos){
  const out = blocos.map(b=>({...b, ini2:b.iniM, dur2:b.dur, adiado:false, cortado:0, pulado:false, resgatado:false}));
  if(!out.length) return { plano:out, ajustes:[] };
  out.sort(porHorario);
  return { plano:out, ajustes: fluir(out, out[0].iniM) };
}

function montarPlano(blocos, replanEm, feitos, resgatados){
  resgatados = resgatados || [];
  const out = blocos.map(b=>({...b, ini2:b.iniM, dur2:b.dur, adiado:false, cortado:0, pulado:false, resgatado:false}));
  if(replanEm === null || replanEm === undefined) return { plano:out, ajustes:[] };

  const fila = [], futuros = [];
  out.forEach(b=>{
    const passou = b.iniM + b.dur <= replanEm;
    if(feitos.includes(b.id)) return;
    if(passou){
      if(resgatados.includes(b.id) && !b.ancora) b.resgatado = true;
      else b.pulado = true;
      return;
    }
    futuros.push(b);
  });
  // primeiro os resgatados, na ordem que a pessoa arrastou; depois o resto do dia
  resgatados.forEach(id=>{ const b = out.find(x=>x.id===id && x.resgatado); if(b) fila.push(b); });
  futuros.sort(porHorario);
  futuros.forEach(b=>fila.push(b));
  if(!fila.length) return { plano:out, ajustes:[] };

  return { plano:out, ajustes: fluir(fila, Math.max(replanEm, fila[0].iniM)) };
}

/* Rede de segurança: por mais que o motor tente, um caminho novo pode gerar
   sobreposição. Aqui nada se sobrepõe — quem tem hora marcada apara o anterior,
   quem não tem é empurrado pra frente. */
function sanear(plano){
  const vivos = plano.filter(b=>!b.adiado && !b.pulado && b.ini2 !== null && b.ini2 !== undefined)
    .sort((a,b)=>a.ini2 - b.ini2 || (b.ancora?1:0) - (a.ancora?1:0));
  for(let i=1;i<vivos.length;i++){
    const ant = vivos[i-1], b = vivos[i];
    const fimAnt = ant.ini2 + ant.dur2;
    if(b.ini2 < fimAnt){
      /* aparar só faz sentido se ainda sobra bloco; senão o "mínimo de 5 min"
         deixaria o anterior invadindo o seguinte de novo */
      const cabeAparar = b.ini2 - ant.ini2 >= 5;
      if(!b.ancora){
        b.ini2 = fimAnt;
        b.empurrado = true;
      }else if(cabeAparar){
        ant.dur2 = b.ini2 - ant.ini2;
        ant.aparado = true;
      }else{
        /* dois fixos exatamente por cima um do outro: mascarar seria mentir.
           Fica visível e o aviso de choque explica. */
        ant.conflita = true; b.conflita = true;
      }
    }
  }
}

/* terminou antes? o que não tem hora marcada anda pra frente junto.
   Evento que JÁ está rolando (a festa começou às 14:00) não é barreira:
   chegar antes só significa mais tempo de evento. */
function adiantar(plano, agora, feitos){
  const vivos = plano.filter(b=>!b.adiado && !b.pulado);
  /* quem foi marcado como feito não pode continuar ocupando o futuro:
     o bloco encolhe até agora, senão ele sobrepõe o que vem depois */
  vivos.forEach(b=>{
    if(feitos.includes(b.id) && b.ini2 < agora && b.ini2 + b.dur2 > agora){
      b.dur2 = Math.max(5, agora - b.ini2);
      b.encerradoAntes = true;
    }
  });
  const pend = vivos.filter(b=>!feitos.includes(b.id));
  if(!pend.length) return;
  const emCurso = b => b.ancora &&
    (b.atrasadoPor > 0 || (b.inicioReal !== undefined && b.inicioReal <= agora));
  const prim = pend[0];
  if((prim.ancora && !emCurso(prim)) || prim.ini2 <= agora) return;
  const antes = vivos.filter(b => b.ini2 < prim.ini2);
  if(!antes.every(b=>feitos.includes(b.id))) return;
  const ganho = prim.ini2 - agora;
  if(ganho < 5) return;
  for(const b of pend){
    if(b.ancora){
      if(emCurso(b)){                      // já está acontecendo: você entra antes e fica mais tempo
        b.eraIni = b.ini2; b.ini2 -= ganho; b.dur2 += ganho;
        b.adiantado = ganho; b.chegouAntes = true;
      }
      break;                               // horário que ainda não chegou segura a fila
    }
    b.eraIni = b.ini2;
    b.ini2 -= ganho;
    b.adiantado = ganho;
  }
}
function fitaHTML(plano, agora){
  let h = "";
  plano.forEach(b=>{
    if(b.adiado || (b.ini2 === null && !b.pulado) || (b.ini2 === undefined && !b.pulado)) return;
    const i = b.pulado ? b.iniM : b.ini2, f = i + (b.pulado ? b.dur : (b.dur2 ?? b.dur));
    if(f <= D0 || i >= D1) return;
    let cls = "fita-seg" + (b.ancora ? " ancora" : "") + (b.pulado ? " pulado" : "");
    if(agora !== undefined && !b.pulado){
      if(agora >= i && agora < f) cls += " atual";
      else if(agora >= f) cls += " passado";
    }
    h += '<div class="'+cls+'" style="left:'+pos(i)+'%;width:'+(pos(f)-pos(i))+'%;background:'+cor(b.cat)+'"></div>';
  });
  if(agora !== undefined && agora >= D0 && agora <= D1)
    h += '<div class="fita-agora" style="left:'+pos(agora)+'%"></div>';
  return h;
}

const CHECK = '<svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,6"/></svg>';

/* arrastar pela alça pra reordenar as linhas de um container */
function arrastavel(cont, aoMudar){
  let alvo = null;
  cont.addEventListener("pointerdown", e=>{
    const alca = e.target.closest(".alca"); if(!alca) return;
    alvo = alca.closest(".rg-item"); if(!alvo) return;
    alvo.classList.add("arrastando");
    try{ alvo.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });
  cont.addEventListener("pointermove", e=>{
    if(!alvo) return;
    e.preventDefault();
    const irmaos = [...cont.querySelectorAll(".rg-item")].filter(r=>r !== alvo);
    let antes = null;
    for(const r of irmaos){
      const cx = r.getBoundingClientRect();
      if(e.clientY < cx.top + cx.height/2){ antes = r; break; }
    }
    if(antes) cont.insertBefore(alvo, antes); else cont.appendChild(alvo);
    if(aoMudar) aoMudar();
  });
  ["pointerup","pointercancel"].forEach(ev=>cont.addEventListener(ev, ()=>{
    if(!alvo) return;
    alvo.classList.remove("arrastando"); alvo = null;
    if(aoMudar) aoMudar();
  }));
}

/* ═══════════ metas e grana ═══════════ */
function granaDoMes(){
  const hoje = new Date(), pre = hoje.getFullYear()+"-"+String(hoje.getMonth()+1).padStart(2,"0");
  let dias = 0;
  Object.entries(dados.registro).forEach(([iso,r])=>{ if(iso.startsWith(pre) && r.grana) dias++; });
  return { dias, total: dias*GRANA.diaria };
}
function renderMetas(){
  const reg = regDe(hojeISO(), new Date().getDay());
  const g = granaDoMes();
  const comGrana = temGrana();
  const pct = comGrana ? Math.min(100, Math.round(g.total/GRANA.mensal*100)) : 0;
  const total = reg.metas.length + (comGrana?1:0);
  const feitas = reg.metas.filter(m=>m.ok).length + (comGrana && reg.grana?1:0);
  let h = '<div class="metas"><div class="metas-topo"><h3>Metas de hoje</h3>'+
    '<span class="metas-conta"><b>'+feitas+'</b> de '+total+'</span></div>';

  if(comGrana) h += '<div class="meta-row meta-grana '+(reg.grana?"ok":"")+'" data-grana="1">'+
    '<button class="caixa" style="'+(reg.grana?"background:var(--sinal-2);border-color:var(--sinal-2)":"")+'" aria-label="Marcar economia">'+CHECK+'</button>'+
    '<span class="meta-txt">Guardar <b>'+GRANA.moeda+' '+GRANA.diaria+'</b> hoje'+
    '<span class="grana-barra"><i style="width:'+pct+'%"></i></span>'+
    '<span class="grana-info">'+GRANA.moeda+' '+g.total+' de '+GRANA.moeda+' '+GRANA.mensal+
    ' este mês · '+g.dias+' dia'+(g.dias===1?"":"s")+' no azul</span></span></div>';

  reg.metas.forEach(m=>{
    h += '<div class="meta-row '+(m.ok?"ok":"")+'" data-meta="'+m.id+'" style="--cor:var(--azul)">'+
      '<button class="caixa" data-acao="ok" style="'+(m.ok?"background:var(--azul);border-color:var(--azul)":"")+'" aria-label="Concluir">'+CHECK+'</button>'+
      '<span class="meta-txt">'+esc(m.txt)+'</span>'+
      '<button class="x" data-acao="del" aria-label="Apagar">×</button></div>';
  });

  h += '<div class="meta-add"><input id="novaMeta" maxlength="80" placeholder="Hoje eu queria muito…">'+
       '<button id="btnMeta">Adicionar</button></div></div>';
  document.getElementById("metasBox").innerHTML = h;

  const box = document.getElementById("metasBox");
  const bg = box.querySelector("[data-grana]");

  box.querySelectorAll("[data-meta]").forEach(row=>{
    row.querySelectorAll("[data-acao]").forEach(b=>b.onclick = e=>{
      e.stopPropagation();
      const m = reg.metas.find(x=>x.id===row.dataset.meta); if(!m) return;
      if(b.dataset.acao==="ok") m.ok = !m.ok;
      else reg.metas = reg.metas.filter(x=>x.id!==row.dataset.meta);
      salvar(); renderMetas();
    });
  });
  const inp = document.getElementById("novaMeta");
  const addM = ()=>{ const t = inp.value.trim(); if(!t) return;
    reg.metas.push({id:"m"+Date.now(), txt:t, ok:false}); inp.value=""; salvar(); renderMetas(); };
  document.getElementById("btnMeta").onclick = addM;
  inp.onkeydown = e=>{ if(e.key==="Enter") addM(); };
}

/* ═══════════ resumo do dia (Diário) ═══════════ */
function resumoDoDia(iso){
  const reg = dados.registro[iso];
  if(!reg) return null;
  const d = new Date(iso+"T12:00:00"), dow = d.getDay();
  const modo = reg.modo || MODO_PADRAO[dow];
  const { blocos, naoCoube, fora } = planoBase(dow, modo, iso);
  const feitos = reg.feitos || [];
  const contam = blocos.filter(b=>b.prio !== "opcional" && !b.urgente);
  const feitosN = contam.filter(b=>feitos.includes(b.id)).length;
  const pct = contam.length ? feitosN/contam.length : 0;
  const imps = reg.imprevistos || [];
  const esps = reg.especiais || [];
  const metas = reg.metas || [];
  const metasOk = metas.filter(m=>m.ok).length + (temGrana() && reg.grana?1:0);
  const metasTot = metas.length + (temGrana()?1:0);
  const bs = blocos.find(b=>b.sono);
  const sono = bs ? (24*60 - bs.iniM) + acordaAmanha(dow, iso) : null;

  const frases = [];
  frases.push(MODO_PADRAO[dow] ? (modo === "presencial" ? "Dia de escritório." : "Trabalho em casa.") : "Dia livre.");
  if(esps.length) frases.push("Teve "+esps.map(e=>e.titulo).join(" e ")+".");
  if(imps.length){
    const tot = imps.reduce((s,e)=>s+e.dur,0);
    frases.push((imps.length>1 ? imps.length+" imprevistos tomaram " : "Um imprevisto tomou ")+dur(tot)+
      " ("+imps.map(e=>e.titulo).join(", ")+").");
  }
  frases.push("Você marcou "+feitosN+" de "+contam.length+" blocos"+
    (pct >= .85 ? " — dia cheio." : pct >= .5 ? "." : " — foi um dia difícil."));
  if(metas.length || reg.grana) frases.push("Metas: "+metasOk+" de "+metasTot+
    (reg.grana ? ", incluindo os "+GRANA.moeda+" "+GRANA.diaria+" guardados." : "."));
  if(naoCoube.length) frases.push("Não coube: "+naoCoube.slice(0,3).map(b=>b.titulo).join(", ")+".");
  if(fora.length) frases.push(fora.length+" bloco"+(fora.length>1?"s saíram":" saiu")+" do dia.");
  if(sono !== null) frases.push("Fechou às "+hhmm(bs.iniM)+", com "+dur(sono)+" de sono pela frente.");

  return { texto: frases.join(" "), pct, feitosN, total:contam.length,
    temImprevisto: imps.length > 0, temEspecial: esps.length > 0, sono };
}

/* prévia de amanhã */
function previaAmanha(){
  const d = new Date(); d.setDate(d.getDate()+1);
  const iso = isoDe(d), dow = d.getDay(), modo = modoDe(iso, dow);
  const { blocos } = planoBase(dow, modo, iso);
  if(!blocos.length) return null;
  const reg = dados.registro[iso] || {};
  const primeiroFixo = blocos.find(b=>b.ancora);
  const bs = blocos.find(b=>b.sono);
  return {
    nome: DIAS[dow].replace("-feira",""),
    modo: MODO_PADRAO[dow] ? (modo === "presencial" ? "escritório" : "em casa") : "livre",
    acorda: blocos[0].ini,
    fixo: primeiroFixo ? primeiroFixo.titulo+" às "+primeiroFixo.ini : null,
    dorme: bs ? bs.ini : null,
    especiais: (reg.especiais || []).length,
    agenda: ((dados.agenda || {})[iso] || []).length
  };
}
/* ═══════════ card de sono ═══════════ */
function renderSono(sono, dormir, dow){
  const box = document.getElementById("sonoBox");
  if(sono === null || dormir === null){ box.innerHTML = ""; return; }
  const acorda = acordaAmanha(dow);
  let nivel, tag, titulo, texto, dicas = [], acao = false;

  if(sono >= 480){
    nivel = "bom"; tag = "Boa noite pela frente";
    titulo = "🎈 "+dur(sono)+" de sono";
    texto = "Seguindo o dia como está, você dorme "+dur(sono)+". É isto que sustenta todo o resto — proteja essa hora de deitar.";
  }else if(sono >= 420){
    nivel = "atencao"; tag = "Atenção";
    titulo = dur(sono)+" de sono";
    texto = "Dá pra funcionar, mas sem folga. Amanhã vai render mais se você ajudar seu corpo:";
    dicas = ["Luz forte nos primeiros 30 min acordado — é o que mais ajuda.",
             "Café até as 14h. Depois disso ele cobra na madrugada seguinte.",
             "Ponha a tarefa mais pesada de amanhã na primeira metade do dia."];
  }else if(sono >= 300){
    nivel = "ruim"; tag = "Pouco sono";
    titulo = dur(sono)+" de sono";
    texto = "Isso cobra o preço amanhã — atenção, humor e paciência caem juntos. Como atravessar melhor:";
    dicas = ["Escolha <b>uma</b> prioridade pra amanhã. Com esse sono, três viram zero.",
             "Cochilo de 20 min depois do almoço, se conseguir. Mais que isso atrapalha a noite.",
             "Evite decisões grandes e conversas difíceis depois das 15h.",
             "Não compense com café à noite — você só empurra o problema pra amanhã."];
    acao = true;
  }else{
    nivel = "grave"; tag = "Isso não se sustenta";
    titulo = dur(sono)+" de sono";
    texto = "Menos de 5 horas não é um dia difícil, é um dia perdido — e você paga com o de depois também. Vale mais cortar algo agora do que atravessar amanhã inteiro assim.";
    dicas = ["Veja o que dá pra encurtar ou tirar hoje à noite.",
             "Se nada puder sair, adie o que puder de amanhã antes de dormir.",
             "Amanhã: só o essencial. Sem culpa por isso."];
    acao = true;
  }

  box.innerHTML = '<div class="sono '+nivel+'">'+
    '<span class="sono-tag">'+tag+'</span>'+
    '<div class="sono-num">'+titulo+'</div>'+
    '<span class="sono-conta">deita '+hhmm(dormir)+' · acorda '+hhmm(acorda)+'</span>'+
    '<p>'+texto+'</p>'+
    (dicas.length ? '<ul>'+dicas.map(d=>'<li>'+d+'</li>').join("")+'</ul>' : '')+
    (acao ? '<div class="aviso-acoes"><button class="bt forte" id="sonoAjustar">Ver o que dá pra cortar</button></div>' : '')+
    '</div>';
  const bt = document.getElementById("sonoAjustar");
  if(bt) bt.onclick = ()=>{ painelNoite = true; renderHoje(); window.scrollTo({top:0,behavior:"smooth"}); };
}
/* ═══════════ HOJE ═══════════ */
function renderHoje(){
  const hoje = new Date(), dow = hoje.getDay(), iso = hojeISO();
  const reg = regDe(iso, dow);
  const agora = agoraMin();
  const { blocos: base, fora, atraso, conflitos, eventos, fimAgenda, naoCoube, estouro, choques, impactos, trabalho } = planoBase(dow, reg.modo, iso);
  const { plano, ajustes } = montarPlano(base, reg.replanEm, reg.feitos, reg.resgatados);
  adiantar(plano, agora, reg.feitos);
  sanear(plano);

  const mb = document.getElementById("modoBox");
  const esp = reg.especiais || [];
  let mbH = "";
  if(MODO_PADRAO[dow]){
    const p = reg.modo === "presencial";
    mbH = '<div class="modo"><button class="'+(p?"on":"")+'" data-modo="presencial">Presencial</button>'+
      '<button class="'+(!p?"on":"")+'" data-modo="casa">Em casa</button></div>'+
      '<p class="modo-nota">'+(reg.modo === MODO_PADRAO[dow] ? 'padrão de '+DIAS[dow].split("-")[0].toLowerCase()
        : 'trocado hoje · avise seu chefe')+'</p>';
  }
  mbH += '<div class="especial-linha"><span>Dia especial?</span>'+
    '<div class="modo mini esp"><button data-esp="nao" class="'+(esp.length?"":"on")+'">Não</button>'+
    '<button data-esp="sim" class="'+(esp.length?"on":"")+'">Sim</button></div></div>'+
    (esp.length ? '<p class="modo-nota esp-nota">'+
      esp.map(e=>(e.ouro?'★ ':'')+esc(e.titulo)+' · '+e.ini).join(' · ')+
      ' <button id="btnEspEditar">editar</button></p>' : '');

  const imps = reg.imprevistos || [];
  const abertos = imps.filter(e=>!e.encerrado);
  const resolvidos = imps.filter(e=>e.encerrado);
  if(abertos.length){
    const e = abertos[0], jaVai = Math.max(0, agoraMin() - min(e.ini));
    mbH += '<div class="urg-faixa"><div><b>Modo imprevisto'+
      (abertos.length>1 ? ' · '+abertos.length+' em aberto' : '')+'</b><span>'+
      esc(e.titulo)+' · desde '+e.ini+(jaVai>=15?' · já são '+dur(jaVai):'')+
      (resolvidos.length ? ' · '+resolvidos.length+' já resolvido'+(resolvidos.length>1?'s':'') : '')+
      '</span></div><div class="urg-acoes">'+
      '<button class="bt-encerrar" data-encerrar="'+e.id+'">Já resolvi</button>'+
      '<button id="btnImp">ajustar</button></div></div>'+
      '<button class="bt-imprevisto" id="btnImpNovo">Aconteceu outro imprevisto</button>';
  }else if(imps.length){
    mbH += '<div class="urg-faixa resolvida"><div><b>'+
      (imps.length>1 ? imps.length+' imprevistos resolvidos' : 'Imprevisto resolvido')+'</b><span>'+
      imps.map(e=>esc(e.titulo)+' · '+e.ini+'–'+(e.fimReal||hhmm(min(e.ini)+e.dur))).join(' · ')+
      ' · '+dur(imps.reduce((s,e)=>s+e.dur,0))+' no total'+
      '</span></div><button id="btnImp">ajustar</button></div>'+
      '<button class="bt-imprevisto" id="btnImpNovo">Aconteceu outro imprevisto</button>';
  }else{
    mbH += '<button class="bt-imprevisto" id="btnImp">Aconteceu um imprevisto</button>';
  }
  mb.innerHTML = mbH;
  const bi = document.getElementById("btnImp");
  if(bi) bi.onclick = ()=>{ impDraft = null; abrirImprevisto(); };
  const bn = document.getElementById("btnImpNovo");
  if(bn) bn.onclick = ()=>{ impDraft = null; abrirImprevisto(); };
  const be2 = mb.querySelector("[data-encerrar]");
  if(be2) be2.onclick = ()=> encerrarImprevisto(be2.dataset.encerrar);
  mb.querySelectorAll("[data-modo]").forEach(b=>b.onclick = ()=>{
    if(reg.modo === b.dataset.modo) return;
    reg.modo = b.dataset.modo; reg.replanEm = null; reg.resgatados = []; salvar(); renderHoje();
  });
  mb.querySelectorAll("[data-esp]").forEach(b=>b.onclick = ()=>{
    if(b.dataset.esp === "sim") abrirEspecial();
    else if(esp.length){ reg.especiais = []; reg.replanEm = null; salvar(); renderHoje(); }
  });
  const be = document.getElementById("btnEspEditar");
  if(be) be.onclick = abrirEspecial;

  document.getElementById("fita").innerHTML = fitaHTML(plano, agora);
  document.getElementById("fitaHoras").innerHTML =
    ["05:00","09:45","14:30","19:15","24:00"].map(t=>'<span>'+t+'</span>').join("");

  const eb = document.getElementById("estouroBox");
  if(impactos.length && !reg.impactosOk){
    eb.innerHTML = '<div class="aviso" style="border-left-color:var(--alerta)">'+
      impactos.map(im=> im.perdido
        ? '<p><b>Você não vai conseguir ir: “'+esc(im.titulo)+'”.</b> '+
          'Era '+im.ini+'–'+im.fim+', e o imprevisto passa por cima do evento inteiro. '+
          'Se tem alguém te esperando, avise agora — é a única parte disso que não pode esperar.</p>'
        : '<p><b>Você vai chegar atrasado em “'+esc(im.titulo)+'”.</b> '+
          'Era '+im.eraIni+'; do jeito que está, você chega '+im.novoIni+' — '+dur(im.atraso)+
          ' depois, com '+dur(im.sobra)+' de evento pela frente. Dá pra ir, mas avise.</p>').join("")+
      '<div class="aviso-acoes">'+
        impactos.filter(im=>!im.perdido).map(im=>
          '<button class="bt" data-desistir="'+esc(im.titulo)+'">Desistir de “'+esc(im.titulo)+'”</button>').join("")+
        '<button class="bt" id="impOk">Entendi</button></div></div>';
    eb.querySelectorAll("[data-desistir]").forEach(btn=>btn.onclick = ()=>{
      const alvo = (reg.especiais||[]).find(e=>e.titulo === btn.dataset.desistir);
      if(alvo) reg.especiais = reg.especiais.filter(e=>e.id !== alvo.id);
      else {
        const b = base.find(x=>x.titulo === btn.dataset.desistir);
        if(b && !reg.cancelados.includes(b.id)) reg.cancelados.push(b.id);
      }
      salvar(); renderHoje();
    });
    document.getElementById("impOk").onclick = ()=>{
      reg.impactosOk = true; salvar(iso); eb.innerHTML = "";
    };
  }else if(choques.length){
    const [a, b2] = choques[0];
    eb.innerHTML = '<div class="aviso" style="border-left-color:var(--alerta)">'+
      '<p><b>Dois horários fixos se cruzam.</b> “'+esc(a.titulo)+'” vai até '+hhmm(a.iniM+a.dur)+
      ' e “'+esc(b2.titulo)+'” começa '+b2.ini+'. Não dá pra estar nos dois — escolha um e eu refaço o resto.</p>'+
      '<div class="aviso-acoes">'+
        '<button class="bt" data-tirar="'+a.id+'">Tirar “'+esc(a.titulo)+'”</button>'+
        '<button class="bt" data-tirar="'+b2.id+'">Tirar “'+esc(b2.titulo)+'”</button></div></div>';
    eb.querySelectorAll("[data-tirar]").forEach(btn=>btn.onclick = ()=>{
      const alvo = btn.dataset.tirar;
      if((reg.especiais||[]).some(e=>e.id===alvo)) reg.especiais = reg.especiais.filter(e=>e.id!==alvo);
      else if(!reg.cancelados.includes(alvo)) reg.cancelados.push(alvo);
      reg.replanEm = null; salvar(); renderHoje();
    });
  }else eb.innerHTML = estouro
    ? '<p class="alerta-linha">Não cabe tudo antes de “'+esc(estouro.titulo)+'”, às '+estouro.hora+
      ': faltavam <b>'+dur(estouro.min)+'</b>. O que sobrou foi pro fim da lista, em “não coube hoje”.</p>' : '';

  const ativos = plano.filter(b=>!b.adiado && !b.pulado);
  /* o que já foi marcado sai da vez: o card mostra o próximo que ainda falta */
  const pendentes = ativos.filter(b=>!reg.feitos.includes(b.id));
  const atual = pendentes.find(b => agora >= b.ini2 && agora < b.ini2 + b.dur2);
  const proximo = pendentes.find(b => b.ini2 >= agora);
  const alvo = atual || proximo;
  const tudoFeito = !alvo && ativos.length && ativos.every(b=>reg.feitos.includes(b.id));
  const card = document.getElementById("cartaoAgora");
  card.style.setProperty("--cor", alvo ? cor(alvo.cat) : "var(--sinal)");
  if(!alvo){
    card.innerHTML = '<div class="agora-topo"><span class="agora-tag">'+
      (tudoFeito ? "Dia limpo" : "Fim do dia")+'</span></div>'+
      '<h2>'+(tudoFeito ? "Tudo marcado" : "Acabou por hoje")+'</h2>'+
      '<p class="agora-nota">'+(tudoFeito
        ? "Você fechou tudo o que estava no plano. Pode fechar o app com a consciência tranquila."
        : "Fecha o app e vai dormir. Amanhã tem passeio.")+'</p>';
    document.getElementById("depois").textContent = "";
  }else{
    const f = alvo.ini2 + alvo.dur2;
    const prog = atual ? Math.round((agora-alvo.ini2)/alvo.dur2*100) : 0;
    const meta = atual
      ? '<span>'+hhmm(alvo.ini2)+' – '+hhmm(f)+'</span><strong>faltam '+dur(f-agora)+'</strong>'
      : '<span>'+(alvo.adiantado?'<s>'+hhmm(alvo.eraIni)+'</s> ':'')+hhmm(alvo.ini2)+' – '+hhmm(f)+'</span>'+
        '<strong>'+(alvo.ini2 <= agora ? 'pode começar' : 'começa em '+dur(alvo.ini2-agora))+'</strong>';
    card.innerHTML = '<div class="agora-topo"><span class="agora-tag">'+(atual?"Agora":"A seguir")+'</span>'+
      '<span class="agora-cat">'+rotulo(alvo.cat)+(alvo.ancora?" · horário fixo":"")+'</span></div>'+
      '<h2>'+esc(alvo.titulo)+'</h2>'+
      (alvo.adiantado
        ? '<p class="agora-nota"><b>'+(alvo.chegouAntes
            ? 'Você chegou '+dur(alvo.adiantado)+' antes' : 'Adiantado '+dur(alvo.adiantado))+'</b>'+
          (alvo.chegouAntes ? ' — '+dur(alvo.adiantado)+' a mais de evento.'
                            : ' porque você terminou o anterior antes.')+'</p>'
        : (alvo.nota ? '<p class="agora-nota">'+esc(alvo.nota)+'</p>' : ''))+
      '<div class="agora-meta">'+meta+'</div>'+
      '<div class="barra"><div class="barra-preench" style="width:'+prog+'%"></div></div>';
    const seg = pendentes.find(b => b.ini2 > alvo.ini2);
    document.getElementById("depois").innerHTML = seg ? 'Depois: <b>'+esc(seg.titulo)+'</b> às '+hhmm(seg.ini2) : '';
  }

  /* aviso / painel de resgate / agenda */
  const box = document.getElementById("avisoBox");
  const candidatos = base.filter(b => !reg.feitos.includes(b.id) && b.iniM + b.dur <= agora && !b.ancora);

  /* quem pode ceder minutos hoje à noite, sem tocar no que é fixo ou inegociável */
  const crus = blocosCrus(dow, reg.modo, iso);
  const doadores = base.filter(b=>{
    if(b.ancora || b.dourado || b.cat === "trabalho") return false;
    if(b.iniM + b.dur <= agora) return false;
    const o = crus.find(x=>x.id===b.id);
    return o && (b.dur - o.min) >= 5;
  }).map(b=>({ ...b, cede: b.dur - crus.find(x=>x.id===b.id).min }))
    .sort((a,b)=>b.cede-a.cede);

  const blocoSono = plano.find(b=>b.sono && !b.adiado && !b.pulado);
  const dormir = blocoSono ? blocoSono.ini2 : horaDeDormir(base);
  const sono = dormir === null ? null : (24*60 - dormir) + acordaAmanha(dow);
  const padrao = planoBase(dow, reg.modo, null);
  const dormirPadrao = horaDeDormir(padrao.blocos);
  const atrasoNoite = (dormir !== null && dormirPadrao !== null) ? dormir - dormirPadrao : 0;

  if(painelNoite){
    const alvoSono = 7*60;
    const porSono = (sono !== null && sono < alvoSono) ? alvoSono - sono : 0;
    const falta = Math.max(0, atrasoNoite, porSono);
    let acumulado = 0;
    const pre = [];
    doadores.forEach(d=>{ if(acumulado < falta){ pre.push(d.id); acumulado += d.cede; } });
    box.innerHTML = '<div class="aviso"><p><b>Encaixar a noite.</b> '+
      (porSono > atrasoNoite
        ? 'Você precisa recuperar '+dur(falta)+' pra chegar a 7h de sono.'
        : 'Você precisa recuperar '+dur(falta)+' pra dormir no horário de sempre.')+
      ' Escolha de onde tirar — o que é fixo e o que você marcou como '+
      'inegociável nem aparece aqui.</p><div class="resgate" id="noiteLista">'+
      doadores.map(d=>'<div class="rg-item" data-id="'+d.id+'" data-cede="'+d.cede+'" data-on="'+(pre.includes(d.id)?1:0)+'">'+
        '<span class="caixa">'+CHECK+'</span>'+
        '<span class="rg-txt">'+esc(d.titulo)+'<em>'+dur(d.dur)+' → '+dur(d.dur-d.cede)+'</em></span>'+
        '<span class="rg-num">−'+d.cede+'</span></div>').join("")+
      (doadores.length?'':'<p class="rg-dica">Não sobrou nada flexível hoje à noite.</p>')+
      '</div>'+
      '<div class="pergunta"><span>Ou acorde mais tarde amanhã</span>'+
        '<p class="rg-dica" style="margin:0 0 8px">Sono é mão dupla. Isso aperta a manhã de amanhã — '+
        'o que não couber antes do seu primeiro horário fixo sai do dia.</p>'+
        '<div class="opcoes">'+[0,15,30,45,60].map(v=>
          '<button class="mini'+(noiteAcordarExtra===v?" on":"")+'" data-acordar="'+v+'">'+
          (v===0?"Não mudar":"+"+v+" min")+'</button>').join("")+'</div>'+
        '<p class="rg-dica" id="noiteCusto" style="margin-top:8px"></p>'+
      '</div>'+
      '<p class="status" id="noiteConta"></p>'+
      '<div class="aviso-acoes"><button class="bt forte" id="noiteOk">Aplicar só hoje</button>'+
      '<button class="bt" id="noiteCancelar">Cancelar</button></div></div>';

    const cont = document.getElementById("noiteLista");
    const acordaBase = acordaAmanha(dow);
    const contar = ()=>{
      let s = 0;
      cont.querySelectorAll('.rg-item[data-on="1"]').forEach(r=>s += Number(r.dataset.cede));
      const novaHora = dormir !== null ? Math.max(dormirPadrao, dormir - s) : null;
      const sonoNovo = sono + (dormir - novaHora) + noiteAcordarExtra;
      document.getElementById("noiteConta").innerHTML =
        "Recuperando "+dur(s)+" de "+dur(falta)+
        (noiteAcordarExtra ? " + "+dur(noiteAcordarExtra)+" de manhã" : "")+
        " · deita "+hhmm(novaHora)+", acorda "+hhmm(acordaBase + noiteAcordarExtra)+
        " → <b>"+dur(sonoNovo)+" de sono</b>";
    };
    contar();
    cont.addEventListener("click", e=>{
      const r = e.target.closest(".rg-item"); if(!r) return;
      r.dataset.on = r.dataset.on === "1" ? "0" : "1"; contar();
    });

    /* custo de acordar mais tarde: simula o dia de amanhã com o despertador atrasado */
    const amanhaD = new Date(); amanhaD.setDate(amanhaD.getDate()+1);
    const isoA = isoDe(amanhaD), dowA = amanhaD.getDay();
    const cruA = blocosCrus(dowA, modoDe(isoA, dowA), isoA);
    const primA = cruA[0];
    const mostrarCusto = ()=>{
      const el = document.getElementById("noiteCusto");
      if(!noiteAcordarExtra || !primA){ el.textContent = ""; return; }
      const sim = comRascunho(isoA, dowA, alvo=>{
        alvo.ajustes[primA.id] = Object.assign({}, normAjuste(alvo.ajustes[primA.id]) || {},
          { ini: hhmm(min(primA.ini) + noiteAcordarExtra) });
      }, ()=>planoBase(dowA, modoDe(isoA, dowA), isoA));
      const perdidos = sim.naoCoube.map(b=>b.titulo);
      el.textContent = "Amanhã você acordaria "+hhmm(min(primA.ini) + noiteAcordarExtra)+
        (perdidos.length ? " e não caberia: "+perdidos.join(", ")+"." : " e a manhã ainda cabe.");
    };
    mostrarCusto();
    document.querySelectorAll("[data-acordar]").forEach(b=>b.onclick = ()=>{
      noiteAcordarExtra = Number(b.dataset.acordar);
      document.querySelectorAll("[data-acordar]").forEach(o=>o.classList.toggle("on", o === b));
      mostrarCusto(); contar();
    });
    document.getElementById("noiteOk").onclick = ()=>{
      let restante = falta;
      cont.querySelectorAll('.rg-item[data-on="1"]').forEach(r=>{
        const b = base.find(x=>x.id===r.dataset.id); if(!b) return;
        const corte = Math.min(Number(r.dataset.cede), Math.max(5, restante));
        restante -= corte;
        reg.ajustes[b.id] = Object.assign({}, normAjuste(reg.ajustes[b.id]) || {}, { dur: b.dur - corte });
      });
      if(noiteAcordarExtra && primA){
        const alvo = regDe(isoA, dowA);
        alvo.ajustes[primA.id] = Object.assign({}, normAjuste(alvo.ajustes[primA.id]) || {},
          { ini: hhmm(min(primA.ini) + noiteAcordarExtra) });
      }
      reg.agendaOk = true; painelNoite = false; noiteAcordarExtra = 0; salvar(); renderHoje();
    };
    document.getElementById("noiteCancelar").onclick = ()=>{
      painelNoite = false; noiteAcordarExtra = 0; renderHoje();
    };
  }else if(painelResgate){
    const marcados = reg.resgatados.length ? reg.resgatados
      : candidatos.filter(b=>b.prio==="essencial").map(b=>b.id);
    const ordenados = [
      ...marcados.map(id=>candidatos.find(c=>c.id===id)).filter(Boolean),
      ...candidatos.filter(c=>!marcados.includes(c.id))
    ];
    box.innerHTML = '<div class="aviso"><p><b>O que ainda precisa acontecer hoje?</b> '+
      'Marque o que não pode ficar de fora — inclusive o que já passou da hora — e '+
      '<b>arraste pela alça</b> pra dizer em que ordem. Encaixo nessa ordem a partir de agora '+
      'e reorganizo o resto em volta.</p><div class="resgate" id="resgateLista">'+
      ordenados.map(b=>'<div class="rg-item" data-id="'+b.id+'" data-on="'+(marcados.includes(b.id)?1:0)+'">'+
        '<span class="alca" aria-hidden="true"><i></i><i></i><i></i></span>'+
        '<span class="caixa">'+CHECK+'</span>'+
        '<span class="rg-txt">'+esc(b.titulo)+'<em>era '+b.ini+' · '+dur(b.dur)+'</em></span>'+
        '<span class="rg-num"></span></div>').join("")+
      '</div>'+
      (candidatos.length ? '<p class="rg-dica">O que ficar desmarcado sai do dia de hoje sem culpa.</p>'
                         : '<p class="rg-dica">Nada pendente pra trás. É só reorganizar daqui pra frente.</p>')+
      '<div class="aviso-acoes" style="margin-top:12px"><button class="bt forte" id="btnConfirmar">Refazer o dia</button>'+
      '<button class="bt" id="btnCancelar">Cancelar</button></div></div>';

    const cont = document.getElementById("resgateLista");
    const numerar = ()=>{
      let n = 0;
      cont.querySelectorAll(".rg-item").forEach(r=>{
        r.querySelector(".rg-num").textContent = r.dataset.on === "1" ? (++n)+"º" : "";
      });
    };
    numerar();
    cont.addEventListener("click", e=>{
      if(e.target.closest(".alca")) return;
      const r = e.target.closest(".rg-item"); if(!r) return;
      r.dataset.on = r.dataset.on === "1" ? "0" : "1";
      numerar();

/* ══════════════════════════════════════════════════════════════
   NUVEM — cole aqui os dados do seu projeto Firebase.
   Enquanto isto estiver como está, o app funciona normalmente,
   só que guardando tudo apenas neste aparelho.
   Passo a passo: veja COMO-PUBLICAR.md
   ══════════════════════════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey:            "COLE_AQUI",
  authDomain:        "COLE_AQUI",
  projectId:         "COLE_AQUI",
  storageBucket:     "COLE_AQUI",
  messagingSenderId: "COLE_AQUI",
  appId:             "COLE_AQUI"
};

/* ══════════════════════════════════════════════════════════════
   PERFIL — as respostas do questionário viram a rotina.
   Abaixo está o padrão de quem ainda não respondeu nada.
   ══════════════════════════════════════════════════════════════ */
const PERFIL_PADRAO = {
  // dom, seg, ter, qua, qui, sex, sáb → "escritorio" | "casa" | "folga"
  dias: ["folga","casa","escritorio","escritorio","casa","escritorio","folga"],
  entrada:"08:00", entradaCasa:"08:30", horas:8, almoco:45, almocoCasa:60, trajeto:30,
  acordarFixo:true, acordar:"05:10", acordarCasa:"06:00", acordarFds:"08:00",
  arrumar:35, banho:25, cafe:15,
  pet:{ tem:true, nome:"Tolstoi", manha:60, manhaCasa:75, noite:75, noiteCasa:40, treino:15, longo:90 },
  fixos:[
    { titulo:"Curso de japonês", dias:[4], ini:"18:00", dur:120, trajeto:30, cat:"curso" },
    { titulo:"Adestramento do Tolstoi", dias:[1,5], ini:"18:30", dur:120, trajeto:0, cat:"tolstoi" }
  ],
  estudo:{ tem:true, titulo:"Mestrado", dias:[2,6,0], dur:50 },
  faxina:{ dia:6, dur:90 },
  prep:{ dia:0, dur:120 },
  pessoas:{ dias:[3], dur:80 },
  jantar:40, reset:15,
  dormir:"22:00", dormirFds:"23:00",
  grana:{ mensal:500, diaria:20, moeda:"R$" }
};
function perfil(){
  try{ return (dados && dados.perfil) ? dados.perfil : PERFIL_PADRAO; }catch(e){ return PERFIL_PADRAO; }
}
function calcModos(){
  return perfil().dias.map(x => x === "escritorio" ? "presencial" : x === "casa" ? "casa" : null);
}
let MODO_PADRAO = calcModos();
let GRANA = perfil().grana;
const temGrana = () => !!(GRANA && GRANA.mensal > 0 && GRANA.diaria > 0);

/* Cada categoria tem uma cor para o tema claro e outra para o escuro,
   escolhidas pra manter contraste nos dois. */
const CATEGORIAS = {
  tolstoi:     { rotulo:"Tolstoi",     cor:"#C77E0A", corEscura:"#F0B429" },
  trabalho:    { rotulo:"Trabalho",    cor:"#2B5CA8", corEscura:"#6FA3E8" },
  mestrado:    { rotulo:"Mestrado",    cor:"#7A4FB0", corEscura:"#B58BE8" },
  casa:        { rotulo:"Casa",        cor:"#15767E", corEscura:"#3FB6BE" },
  pessoas:     { rotulo:"Pessoas",     cor:"#BC3A57", corEscura:"#F0788F" },
  descanso:    { rotulo:"Descanso",    cor:"#5A6B8C", corEscura:"#93A2CC" },
  organizacao: { rotulo:"Organização", cor:"#A85B22", corEscura:"#E0925A" },
  trajeto:     { rotulo:"Trajeto",     cor:"#78889E", corEscura:"#A8B5C8" },
  curso:       { rotulo:"Curso",       cor:"#2E7DBD", corEscura:"#7FC0F5" },
  imprevisto:  { rotulo:"Imprevisto",  cor:"#B3324C", corEscura:"#F08098" }
};

const HABITOS = [
  { key:"passeio",  nome:"Passeio da manhã" },
  { key:"passeio2", nome:"Passeio da noite" },
  { key:"mestrado", nome:"Mestrado" },
  { key:"reset",    nome:"Reset da casa" },
  { key:"kit",      nome:"Kit de amanhã" },
  { key:"treino",   nome:"Treino do Tolstoi" },
  { key:"faxina",   nome:"Faxina da semana" },
  { key:"prep",     nome:"Prep da semana" }
];

<style>
:root{
  --paper:#F1F4F9; --card:#FFFFFF; --card-2:#FFFFFF;
  --ink:#0B1524; --ink-2:#4A5A72; --ink-3:#6E7D93;
  --linha:rgba(11,21,36,.12); --linha-forte:rgba(11,21,36,.26);
  --sinal:#8F5F05; --sinal-2:#E8A317; --alerta:#B3324C; --azul:#1F4E9C; --ok:#1F7A55;
  --sombra:0 1px 2px rgba(11,21,36,.06), 0 12px 28px -18px rgba(11,21,36,.40);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0A121F; --card:#131E2E; --card-2:#182437;
    --ink:#EAF0F9; --ink-2:#A7B6CC; --ink-3:#7B8CA5;
    --linha:rgba(234,240,249,.12); --linha-forte:rgba(234,240,249,.26);
    --sinal:#F2C14E; --sinal-2:#F2C14E; --alerta:#F08098; --azul:#7FB0F0; --ok:#5FC79A;
    --sombra:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -16px rgba(0,0,0,.85);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sinal);outline-offset:3px;border-radius:8px}
.app{max-width:480px;margin:0 auto;padding:0 18px 116px}

.topo{padding:calc(20px + env(safe-area-inset-top)) 0 12px}
.topo-linha{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.eyebrow{margin:0 0 4px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3)}
.marca{color:var(--ink);font-weight:600;letter-spacing:.10em}
.marca::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--sinal-2);margin-right:7px;vertical-align:1px}
.titulo{margin:0;font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:29px;line-height:1.05;
  letter-spacing:-.02em;font-variation-settings:"SOFT" 20,"WONK" 1}
.relogio{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;
  border:1px solid var(--linha-forte);border-radius:999px;padding:7px 12px;color:var(--ink-2);
  display:flex;align-items:center;gap:6px;white-space:nowrap}
.relogio.ativo{border-color:var(--sinal);color:var(--sinal)}
.ponto-vivo{width:6px;height:6px;border-radius:50%;background:var(--sinal-2)}
.previa{margin-top:12px;background:var(--card);border:1px solid var(--linha);border-radius:var(--r);padding:12px 14px}
.previa p{margin:0 0 8px;font-size:12px;color:var(--ink-2)}
.previa-linha{display:flex;align-items:center;gap:12px}
.previa input[type=range]{flex:1;accent-color:var(--sinal);min-width:0}
.previa button{font-size:12px;color:var(--sinal);font-weight:600;white-space:nowrap}

.modo{display:flex;gap:6px;background:var(--card);border:1px solid var(--linha);border-radius:999px;
  padding:4px;margin:16px 0 4px}
.modo button{flex:1;padding:9px 6px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--ink-3)}
.modo button.on{background:var(--ink);color:var(--paper);font-weight:600}
.modo-nota{margin:6px 2px 0;font-size:11.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}

.fita-bloco{margin:14px 0 18px}
.fita{position:relative;height:44px;border-radius:10px;overflow:hidden;background:var(--card);border:1px solid var(--linha)}
.fita-seg{position:absolute;top:0;bottom:0;opacity:.55}
.fita-seg.ancora{opacity:.7;border-top:3px solid var(--ink)}
.fita-seg.passado{opacity:.22}
.fita-seg.pulado{opacity:.10}
.fita-seg.atual{opacity:1}
.fita-agora{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--sinal-2);z-index:3}
.fita-agora::before{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);
  width:9px;height:9px;border-radius:50%;background:var(--sinal-2);box-shadow:0 0 0 3px var(--paper)}
.fita-horas{display:flex;justify-content:space-between;margin-top:6px}
.fita-horas span{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);letter-spacing:.06em}

.agora{background:var(--card-2);border:1px solid var(--linha);border-radius:20px;padding:18px 18px 16px;
  box-shadow:var(--sombra);margin-bottom:8px;position:relative;overflow:hidden}
.agora::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cor,var(--sinal))}
.agora-topo{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.agora-tag{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink);font-weight:600;display:flex;align-items:center;gap:7px}
.agora-tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cor,var(--sinal-2));flex:0 0 auto}
.agora-cat{font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.agora h2{margin:0;font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:25px;line-height:1.15;
  letter-spacing:-.015em;font-variation-settings:"SOFT" 30,"WONK" 1}
.agora-nota{margin:7px 0 0;font-size:14px;color:var(--ink-2)}
.agora-meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;
  font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2)}
.agora-meta strong{color:var(--ink);font-weight:600}
.barra{height:4px;border-radius:99px;background:var(--linha);margin-top:8px;overflow:hidden}
.barra-preench{height:100%;background:var(--cor,var(--sinal));border-radius:99px}
.depois{margin:0 0 20px;font-size:12.5px;color:var(--ink-3);padding-left:4px}
.depois b{color:var(--ink-2);font-weight:500}

/* metas */
.metas{background:var(--card-2);border:1px solid var(--linha);border-radius:20px;padding:16px 16px 12px;
  box-shadow:var(--sombra);margin-bottom:22px}
.metas-topo{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.metas-topo h3{margin:0;font-family:"Fraunces",Georgia,serif;font-size:19px;font-weight:500;
  font-variation-settings:"WONK" 1}
.metas-conta{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-2)}
.metas-conta b{font-size:19px;color:var(--ink)}
.meta-row{display:flex;align-items:flex-start;gap:11px;padding:8px 0;border-top:1px solid var(--linha)}
.meta-row:first-of-type{border-top:0}
.meta-row .caixa{flex:0 0 auto;margin-top:1px}
.meta-txt{flex:1;font-size:14.5px;line-height:1.35}
.meta-row.ok .meta-txt{text-decoration:line-through;color:var(--ink-3)}
.meta-row.meta-grana.ok .meta-txt{text-decoration:none;color:var(--ink-2)}
.meta-row.meta-grana.ok .meta-txt b{color:var(--sinal)}
.meta-row .x{color:var(--ink-3);font-size:17px;line-height:1;padding:0 2px}
.meta-grana{--cor:var(--sinal-2)}
.meta-grana .meta-txt b{font-family:"Fraunces",Georgia,serif;font-size:17px;font-weight:600;color:var(--sinal)}
.grana-barra{margin:6px 0 2px;height:5px;border-radius:99px;background:var(--linha);overflow:hidden}
.grana-barra i{display:block;height:100%;background:var(--sinal-2);border-radius:99px}
.grana-info{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);margin-top:4px;display:block}
.meta-add{display:flex;gap:8px;margin-top:10px;border-top:1px solid var(--linha);padding-top:10px}
.meta-add input{flex:1;min-width:0;background:transparent;border:0;font-size:14.5px;padding:4px 0}
.meta-add input::placeholder{color:var(--ink-3)}
.meta-add button{font-size:13px;font-weight:600;color:var(--azul);white-space:nowrap}

/* aviso / resgate */
.aviso{background:var(--card);border:1px solid var(--linha-forte);border-left:3px solid var(--sinal-2);
  border-radius:12px;padding:14px;margin:0 0 20px}
.aviso p{margin:0 0 10px;font-size:13.5px;color:var(--ink-2);line-height:1.45}
.aviso p b{color:var(--ink)}
.aviso-acoes{display:flex;gap:8px;flex-wrap:wrap}
.bt{border:1px solid var(--linha-forte);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:500}
.bt.forte{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.resgate{margin:10px 0 12px}
.rg-item{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--linha);
  background:var(--card);touch-action:pan-y;user-select:none}
.rg-item.arrastando{background:var(--card-2);border-radius:10px;border-top-color:transparent;
  box-shadow:var(--sombra);position:relative;z-index:2}
.alca{flex:0 0 auto;padding:8px 3px;touch-action:none;cursor:grab}
.alca i{display:block;width:14px;height:2px;border-radius:2px;background:var(--ink-3);margin:3px 0}
.rg-item .caixa{margin-top:0;flex:0 0 auto}
.rg-txt{flex:1;font-size:14px;line-height:1.3}
.rg-txt em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.rg-num{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--azul);font-weight:600;
  min-width:22px;text-align:right}
.rg-item[data-on="1"] .caixa{background:var(--azul);border-color:var(--azul)}
.rg-item[data-on="1"] .caixa svg{opacity:1}
.rg-item:not([data-on="1"]) .rg-txt{color:var(--ink-3)}
.rg-dica{margin:2px 0 0;font-size:12px;color:var(--ink-3);line-height:1.4}
.alerta-linha{margin:0 0 16px;font-size:13px;line-height:1.45;color:var(--ink-2);
  border-left:3px solid var(--alerta);background:var(--card);border-radius:0 10px 10px 0;padding:10px 12px}
.alerta-linha b{color:var(--alerta)}
.chip-replan{display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--sinal);margin:0 0 16px;
  border:1px dashed var(--linha-forte);border-radius:10px;padding:8px 12px}
.chip-replan button{font-size:11px;text-decoration:underline;color:var(--ink-2);white-space:nowrap}

/* lista */
.faixa{display:flex;align-items:center;gap:10px;margin:20px 0 6px}
.faixa span{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.faixa i{flex:1;height:1px;background:var(--linha);display:block}
.item{display:grid;grid-template-columns:46px 16px 1fr 28px;align-items:start;width:100%;text-align:left;
  padding:9px 0;position:relative}
.item-hora{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;line-height:1.45;padding-top:1px;
  border-radius:6px;border-bottom:1px dotted transparent}
.item:not(.passado):not(.fora) .item-hora{border-bottom-color:var(--linha-forte);padding-bottom:1px}
.item-hora em{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3);font-weight:400}
.item-hora s{color:var(--sinal);font-size:10px;display:block;text-decoration:none}
.item-hora s.antes{text-decoration:line-through;color:var(--ink-3);font-size:11px;opacity:.8}
.agora-meta s{text-decoration:line-through;color:var(--ink-3);opacity:.8}
.trilho{position:relative;height:100%;display:flex;justify-content:center;padding-top:6px}
.trilho::before{content:"";position:absolute;top:0;bottom:-18px;width:1px;background:var(--linha)}
.item:last-child .trilho::before{display:none}
.bolinha{width:9px;height:9px;border-radius:50%;background:var(--cor);position:relative;z-index:2;
  box-shadow:0 0 0 3px var(--paper)}
.bolinha.ancora{border-radius:2px;width:8px;height:8px}
.item-corpo{padding-left:2px;padding-right:6px}
.item-titulo{font-size:15px;font-weight:500;line-height:1.35}
.item-nota{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px;line-height:1.35}
.tag{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);border:1px solid var(--linha-forte);border-radius:4px;
  padding:1px 4px;margin-left:6px;vertical-align:1px}
.tag.mov{color:var(--sinal);border-color:var(--sinal)}
.caixa{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--linha-forte);margin-top:3px;
  display:flex;align-items:center;justify-content:center}
.caixa svg{width:12px;height:12px;stroke:var(--paper);stroke-width:3;fill:none;opacity:0}
.item.passado .item-hora,.item.passado .item-titulo{color:var(--ink-3)}
.item.passado .bolinha{opacity:.4}
.item.feito .item-titulo{text-decoration:line-through;text-decoration-thickness:1px;color:var(--ink-3)}
.item.feito .caixa{background:var(--cor);border-color:var(--cor)}
.item.feito .caixa svg{opacity:1}
.item.atual{background:var(--card);border-radius:12px;padding:9px 8px;margin-left:-8px;width:calc(100% + 16px)}
.item.atual .item-titulo{font-weight:600}
.item.pulado{opacity:.5}
.entre{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 2px;
  color:var(--azul);font-size:12.5px;font-weight:500}
.entre i{flex:1;height:0;border-top:1px dashed var(--linha-forte)}
.entre span{flex:0 0 auto;border:1px dashed var(--linha-forte);border-radius:999px;
  padding:3px 11px;background:var(--card);white-space:nowrap}
.entre:active span{background:var(--azul);color:var(--paper);border-color:var(--azul)}
.item.encaixe .item-titulo{font-style:italic}
.nc-intro{margin:2px 0 10px;font-size:12.5px;line-height:1.45;color:var(--ink-3)}
.nc-acoes{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.nc-acoes button{font-size:12px;font-weight:500;border:1px solid var(--linha-forte);border-radius:999px;
  padding:5px 11px;color:var(--ink-2)}
.nc-acoes button[data-nc-acao="ouro"]{color:var(--sinal);border-color:var(--sinal-2)}
.item.adiado{opacity:1}
.item.adiado .item-titulo{color:var(--ink-2)}
.item.adiado .bolinha{opacity:.5}
.item.perdido .item-titulo{color:var(--alerta)}
.item.resgatado .item-hora{color:var(--azul)}

/* modal mover */
.sheet-bg{position:fixed;inset:0;background:rgba(16,27,46,.45);z-index:40;display:flex;align-items:flex-end;
  justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 18px
  calc(20px + env(safe-area-inset-bottom));box-shadow:var(--sombra);max-height:86vh;overflow-y:auto}
.campo{display:block}
.campo>input,.campo>select{width:100%}
.campo span{display:block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.mst-dia{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin:18px 0 2px;padding-top:10px;border-top:1px solid var(--linha)}
.mst-item{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;padding:9px 4px;border-radius:8px}
.mst-item b{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:500;min-width:44px;color:var(--ink)}
.mst-item span{flex:1;font-size:14px;line-height:1.3}
.mst-item em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);white-space:nowrap}
.mst-item.mudado em{color:var(--azul);font-weight:600}
.mst-item.fora{opacity:.5}
.mst-item.fora span{text-decoration:line-through}
.link-discreto{display:block;width:100%;text-align:center;margin-top:18px;font-size:12.5px;
  color:var(--ink-3);text-decoration:underline}
.sheet h3{margin:0 0 4px;font-family:"Fraunces",Georgia,serif;font-size:20px;font-weight:500}
.sheet p{margin:0 0 14px;font-size:13px;color:var(--ink-2)}
.sheet input[type=time],.sheet input[type=text],.sheet input[type=number],.sheet select{
  width:100%;background:var(--card);border:1px solid var(--linha-forte);border-radius:12px;
  padding:11px 12px;font-size:16px;margin-bottom:10px}
.sheet textarea{width:100%;height:104px;background:var(--card);border:1px solid var(--linha-forte);
  border-radius:12px;padding:11px 12px;font-family:"IBM Plex Mono",monospace;font-size:12px;
  line-height:1.4;resize:vertical;margin-bottom:10px;color:var(--ink)}
.sheet .status{font-size:12.5px;color:var(--ink-2);margin:0 0 10px;line-height:1.45}
.sheet .status.erro{color:var(--alerta)}
.sheet .acoes{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.sheet .acoes .bt{text-align:center;padding:12px}
.sheet .fechar{display:block;width:100%;text-align:center;margin-top:12px;font-size:13px;color:var(--ink-3)}

/* semana */
.dia-card{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);padding:14px;
  margin-bottom:10px;width:100%;text-align:left;display:block}
.dia-cab{display:block;width:100%;text-align:left}
.dia-data{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);margin-left:8px;font-weight:400}
.modo.mini{margin:10px 0 2px;padding:3px}
.especial-linha{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.especial-linha>span{font-size:14px;color:var(--ink-2);font-weight:500}
.modo.mini.esp{width:168px;margin:0;flex:0 0 auto}
.esp-nota{color:var(--sinal)}
.esp-nota button{color:var(--ink-2);text-decoration:underline;font-family:inherit;font-size:11.5px}
.item.especial .item-titulo{font-weight:600}
.modo.mini button{padding:7px 4px;font-size:12.5px}
.item.fora{opacity:.55}
.item.fora .item-hora{text-decoration:line-through;color:var(--ink-3)}
.item.fora .item-titulo{text-decoration:line-through;text-decoration-thickness:1px}
.dia-card.hoje{border-color:var(--sinal-2)}
.dia-topo{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;gap:8px}
.dia-nome{font-family:"Fraunces",Georgia,serif;font-size:17px;font-weight:500;font-variation-settings:"WONK" 1}
.dia-conta{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);text-align:right;line-height:1.5}
.dia-modo{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:8px;display:block}
.dia-card .fita{height:24px;background:transparent;border:0}
.dia-card .fita-seg{opacity:.65;border-radius:2px}
.dia-detalhe{margin-top:12px;padding-top:10px;border-top:1px solid var(--linha)}
.dia-detalhe div{display:flex;gap:10px;font-size:13px;padding:3px 0;color:var(--ink-2)}
.dia-detalhe b{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--ink);font-size:12px;min-width:42px}
.sec-titulo{font-family:"Fraunces",Georgia,serif;font-size:20px;font-weight:500;margin:28px 0 4px}
.sec-sub{margin:0 0 14px;font-size:13px;color:var(--ink-2);line-height:1.45}
.extra{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--linha);
  border-radius:12px;padding:11px 12px;margin-bottom:8px}
.extra i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.extra span{flex:1;font-size:14px}
.extra em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);display:block}
.extra button{color:var(--ink-3);font-size:18px;padding:0 2px}
.linha-campos{display:flex;gap:8px}
.linha-campos>*{flex:1;min-width:0}
.bt-largo{display:block;width:100%;text-align:center;background:var(--ink);color:var(--paper);
  border-radius:12px;padding:12px;font-weight:600;font-size:14px;margin-top:2px}

/* agenda do trabalho */
.agenda-card{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);
  padding:14px;margin-bottom:22px}
.agenda-topo{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.agenda-topo h3{margin:0;font-family:"Fraunces",Georgia,serif;font-size:17px;font-weight:500}
.agenda-topo button{font-size:12.5px;color:var(--azul);font-weight:600}
.ag-lista{display:block}
.ag-item{display:flex;align-items:baseline;gap:10px;padding:6px 0;border-top:1px solid var(--linha);font-size:14px}
.ag-item:first-child{border-top:0}
.ag-item b{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:500;color:var(--ink-2);min-width:88px}
.ag-item span{flex:1;line-height:1.3}
.ag-item.estoura b{color:var(--alerta);font-weight:600}
.ag-item button{color:var(--ink-3);font-size:17px;line-height:1;padding:0 2px}
.ag-vazio{margin:0;font-size:13px;color:var(--ink-2);line-height:1.45}

/* inegociáveis */
.estrela{color:var(--sinal-2);margin-right:5px;font-size:12px;vertical-align:1px}
.item.dourado .item-corpo{border-left:2px dashed var(--sinal-2);margin-left:-6px;padding-left:8px}
.mst-linha{display:flex;align-items:center;gap:4px}
.mst-linha.ouro{border-left:2px dashed var(--sinal-2);padding-left:6px;margin-left:-8px}
.mst-star{flex:0 0 auto;padding:8px 6px;font-size:15px;color:var(--ink-3)}
.mst-star.on{color:var(--sinal-2)}
.mst-x{flex:0 0 auto;padding:8px 8px;font-size:18px;line-height:1;color:var(--ink-3)}
.bt.perigo{color:var(--alerta);border-color:var(--alerta)}
/* imprevisto */
.bt-imprevisto{display:block;width:100%;margin-top:10px;padding:11px;border-radius:12px;
  border:1px dashed var(--alerta);color:var(--alerta);font-size:13.5px;font-weight:500;text-align:center}
.urg-faixa{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;
  padding:11px 13px;border-radius:12px;background:color-mix(in srgb,var(--alerta) 12%,var(--card));
  border:1px solid var(--alerta)}
.urg-faixa b{display:block;font-size:13px;color:var(--alerta);letter-spacing:.02em}
.urg-faixa span{display:block;font-size:12px;color:var(--ink-2);margin-top:2px}
.urg-faixa button{font-size:12.5px;color:var(--ink-2);text-decoration:underline;white-space:nowrap}
.urg-acoes{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.bt-encerrar{background:var(--ok);color:var(--paper);border-radius:999px;padding:7px 13px;
  font-size:12.5px;font-weight:600;white-space:nowrap}
.urg-faixa .bt-encerrar,.ag-item .bt-encerrar{color:var(--paper);text-decoration:none}
.ag-item .bt-encerrar{padding:5px 10px;font-size:11.5px}
.urg-faixa.resolvida{background:var(--card);border-color:var(--linha-forte)}
.urg-faixa.resolvida b{color:var(--ink-2)}
.bt.perigo-forte{background:var(--alerta);border-color:var(--alerta);color:#fff}
.item.urgente .item-corpo{border-left:2px solid var(--alerta);margin-left:-6px;padding-left:8px}
.item.urgente .item-titulo{font-weight:600;color:var(--alerta)}
/* card de sono */
.sono{border-radius:20px;padding:16px 16px 14px;margin-bottom:22px;border:1px solid var(--linha);
  box-shadow:var(--sombra);background:var(--card-2)}
.sono-tag{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:600;display:block;margin-bottom:6px}
.sono-num{font-family:"Fraunces",Georgia,serif;font-size:27px;font-weight:600;line-height:1.1;
  letter-spacing:-.015em}
.sono-conta{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);
  display:block;margin-top:4px}
.sono p{margin:10px 0 0;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.sono ul{margin:10px 0 0;padding-left:18px}
.sono li{font-size:13px;line-height:1.45;color:var(--ink-2);margin-bottom:5px}
.sono .aviso-acoes{margin-top:12px}
.sono.bom{border-left:4px solid var(--ok)}
.sono.bom .sono-tag{color:var(--ok)}
.sono.bom .sono-num{color:var(--ok)}
.sono.atencao{border-left:4px solid var(--sinal-2)}
.sono.atencao .sono-tag,.sono.atencao .sono-num{color:var(--sinal)}
.sono.ruim{border-left:4px solid var(--alerta)}
.sono.ruim .sono-tag,.sono.ruim .sono-num{color:var(--alerta)}
.sono.grave{border-left:4px solid var(--alerta);background:color-mix(in srgb,var(--alerta) 8%,var(--card-2))}
.sono.grave .sono-tag,.sono.grave .sono-num{color:var(--alerta)}
/* formulário progressivo do dia especial */
.pergunta{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--linha)}
.pergunta>span{display:block;font-size:14px;font-weight:500;margin-bottom:9px;color:var(--ink)}
.pergunta .acoes{margin-top:0}
.opcoes{display:flex;flex-wrap:wrap;gap:6px}
.opcoes .mini{border:1px solid var(--linha-forte);border-radius:999px;padding:8px 13px;font-size:13px;
  color:var(--ink-2)}
.opcoes .mini.on{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
.resumo{margin:18px 0 12px;padding:13px 14px;background:var(--card);border:1px solid var(--linha);
  border-left:3px solid var(--sinal-2);border-radius:0 12px 12px 0}
.resumo b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  font-family:"IBM Plex Mono",monospace;color:var(--ink-3);margin-bottom:8px;font-weight:600}
.resumo div{display:flex;gap:10px;font-size:14px;padding:3px 0;color:var(--ink)}
.resumo i{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-2);min-width:46px}
.resumo em{font-style:normal;color:var(--ink-3);font-size:12px}
.ag-item em{font-style:normal;color:var(--ink-3);font-size:11.5px}
/* questionário */
.sem-estados{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
.est{border:1px solid var(--linha-forte);border-radius:10px;padding:8px 2px;text-align:center;
  display:flex;flex-direction:column;gap:3px;align-items:center}
.est b{font-family:"IBM Plex Mono",monospace;font-size:12px}
.est span{font-size:8.5px;line-height:1.1;color:var(--ink-3);letter-spacing:.02em}
.est.escritorio{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.est.escritorio span{color:var(--paper);opacity:.75}
.est.casa{background:var(--card);border-color:var(--azul);color:var(--azul)}
.est.casa span{color:var(--azul);opacity:.8}
.est.folga{opacity:.55}
.dias-linha{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
.dias-linha button{border:1px solid var(--linha-forte);border-radius:9px;padding:9px 0;
  font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}
.dias-linha button.on{background:var(--azul);border-color:var(--azul);color:#fff;font-weight:600}
.sheet.tut .campo{margin-bottom:10px}
.tut-bg{align-items:center;padding:20px}
.sheet.tut{border-radius:20px;max-width:400px;padding:24px 20px 20px;text-align:left}
.sheet.tut h3{font-size:23px;margin-bottom:8px}
.sheet.tut p{font-size:15px;line-height:1.5;color:var(--ink-2);margin-bottom:18px}
.tut-passo{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:6px}
.tut-pontos{display:flex;gap:6px;margin-bottom:16px}
.tut-pontos i{width:22px;height:3px;border-radius:99px;background:var(--linha-forte)}
.tut-pontos i.on{background:var(--sinal-2)}
.pilha-form{display:flex;gap:8px;margin-bottom:16px}
.pilha-form input{flex:1;min-width:0;background:var(--card);border:1px solid var(--linha-forte);
  border-radius:12px;padding:11px 13px;font-size:15px}
.pilha-form button{background:var(--ink);color:var(--paper);border-radius:12px;padding:0 16px;font-weight:600}
.tarefa{display:flex;align-items:flex-start;gap:11px;padding:11px 12px;background:var(--card);
  border:1px solid var(--linha);border-radius:12px;margin-bottom:8px}
.tarefa .caixa{margin-top:0;flex:0 0 auto;--cor:var(--ink)}
.tarefa span{flex:1;font-size:14.5px;line-height:1.35}
.tarefa.ok span{text-decoration:line-through;color:var(--ink-3)}
.tarefa.ok .caixa{background:var(--ink);border-color:var(--ink)}
.tarefa.ok .caixa svg{opacity:1}
.tarefa .hoje{font-size:11px;font-weight:600;color:var(--azul);white-space:nowrap;padding-top:2px}
.tarefa .x{color:var(--ink-3);font-size:18px;line-height:1;padding:0 2px}

/* hábitos */
.placar{background:var(--card-2);border:1px solid var(--linha);border-radius:20px;padding:18px;
  box-shadow:var(--sombra);margin-bottom:18px}
.placar-num{font-family:"Fraunces",Georgia,serif;font-size:38px;line-height:1;font-weight:600;
  font-variation-settings:"WONK" 1}
.placar-num small{font-size:16px;color:var(--ink-3);font-weight:400}
.placar p{margin:8px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.45}
.placar-div{height:1px;background:var(--linha);margin:16px 0}
.habito{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);padding:14px;margin-bottom:10px}
.habito-topo{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px;gap:8px}
.habito-nome{font-size:15px;font-weight:500}
.habito-conta{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);white-space:nowrap}
.habito-dias{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dia-ponto{aspect-ratio:1;border-radius:9px;border:1.5px solid var(--linha);display:flex;align-items:center;
  justify-content:center;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
.dia-ponto.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.dia-ponto.na{opacity:.35}
.dia-ponto.hoje{box-shadow:0 0 0 2px var(--sinal-2)}

.legenda{display:flex;flex-wrap:wrap;gap:8px 14px;margin:22px 0 0}
.legenda span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.legenda i{width:8px;height:8px;border-radius:50%}
.nota-rodape{margin:24px 0 0;font-size:12px;line-height:1.55;color:var(--ink-3);
  border-top:1px solid var(--linha);padding-top:14px}
.nota-rodape button{color:var(--ink-2);text-decoration:underline;font-size:12px}
.vazio{padding:26px 0;text-align:center;color:var(--ink-2);font-size:14px;line-height:1.5}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--linha);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.tabs-int{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 18px}
.tab{padding:8px 4px;border-radius:12px;text-align:center;font-size:12px;color:var(--ink-3);font-weight:500}
.tab.on{color:var(--ink);background:var(--card)}
.selo{display:inline-block;min-width:16px;font-family:"IBM Plex Mono",monospace;font-size:10px;
  background:var(--sinal-2);color:#0B1524;border-radius:99px;padding:0 4px;margin-left:4px;font-weight:600}
/* prévia de amanhã */
.amanha{margin-top:22px;padding:15px 16px;background:var(--card);border:1px solid var(--linha);
  border-radius:var(--r)}
.amanha-tag{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:5px}
.amanha-num{font-family:"Fraunces",Georgia,serif;font-size:19px;font-weight:500;
  font-variation-settings:"WONK" 1}
.amanha p{margin:7px 0 0;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.amanha p b{color:var(--ink)}
.amanha .link-discreto{margin-top:10px;text-align:left}

/* diário */
.cal-topo{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-topo span{font-family:"Fraunces",Georgia,serif;font-size:17px;font-weight:500}
.cal-topo button{width:34px;height:34px;border-radius:50%;border:1px solid var(--linha-forte);
  font-size:16px;color:var(--ink-2)}
.cal-topo button[disabled]{opacity:.3}
.cal-grade{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-cab{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);text-align:center;
  padding-bottom:2px}
.cal-dia{aspect-ratio:1;border-radius:10px;border:1px solid var(--linha);font-size:13px;
  color:var(--ink-2);display:flex;align-items:center;justify-content:center;position:relative}
.cal-dia.vazio,.cal-dia.futuro{opacity:.4}
.cal-dia.otimo{background:color-mix(in srgb,var(--ok) 22%,transparent);border-color:var(--ok);color:var(--ink)}
.cal-dia.ok{background:color-mix(in srgb,var(--sinal-2) 22%,transparent);border-color:var(--sinal-2);color:var(--ink)}
.cal-dia.ruim{background:color-mix(in srgb,var(--alerta) 14%,transparent);border-color:var(--alerta);color:var(--ink)}
.cal-dia.imprev{background:color-mix(in srgb,var(--alerta) 30%,transparent);border-color:var(--alerta);
  color:var(--ink);font-weight:600}
.cal-dia.hoje{box-shadow:0 0 0 2px var(--ink)}
.cal-dia.sel{outline:2px solid var(--azul);outline-offset:1px}
.dia-resumo{margin-top:18px;padding-top:14px;border-top:1px solid var(--linha)}
.dia-resumo p{margin:0;font-size:14px;line-height:1.55;color:var(--ink-2)}
.diario-item{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);
  padding:14px;margin-bottom:10px}
.diario-item.imprev{border-left:3px solid var(--alerta)}
.diario-cab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.diario-cab b{font-family:"Fraunces",Georgia,serif;font-size:16px;font-weight:500}
.diario-cab span{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}
.diario-item p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.diario-nota{margin-top:8px!important;font-style:italic;color:var(--ink-3)!important}
.tabs-int.cinco{grid-template-columns:repeat(5,1fr)}
.tabs-int.cinco .tab{font-size:11px;padding:8px 2px}

/* mudar horário: prévia e caminhos */
.mv-carregando{margin:0 0 10px!important;font-size:12.5px;color:var(--ink-3)}
.mv-previa{margin:0 0 12px;padding:11px 12px;background:var(--card);
  border:1px solid var(--linha);border-radius:12px}
.mv-previa p{margin:7px 0 0!important;font-size:13px;line-height:1.45;color:var(--ink-2)}
.mv-previa .mv-mais{color:var(--azul);font-size:12px}

.mv-bom{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.mv-medio{background:color-mix(in srgb,var(--sinal-2) 22%,transparent);color:var(--sinal)}

.nv-diag li{white-space:normal}
.nv-ok{color:var(--ok)}

/* Rede de segurança: o app troca de aba pondo `hidden` nas seções. Uma regra
   de layout com seletor de ID vence o `[hidden]` do navegador e a tela nunca
   some. Isto garante que esconder sempre ganha. */
[hidden]{display:none!important}

/* ═══ as duas colunas ═══
   No celular elas se dissolvem (display:contents) e a ordem original é
   reconstruída com `order`. No PC viram colunas de verdade, cada uma com
   altura própria — é isso que evita buraco de um lado quando o outro cresce. */
#tela-hoje:not([hidden]){display:flex;flex-direction:column}
.col-principal,.col-lateral{display:contents}
#modoBox{order:1} #tela-hoje .fita-bloco{order:2} #estouroBox{order:3} #avisoBox{order:4}
#cartaoAgora{order:5} #depois{order:6} #agendaBox{order:7} #trabalhoBox{order:8}
#metasBox{order:9} #sonoBox{order:10} #lista{order:11} #amanhaBox{order:12}
#tela-hoje .legenda{order:13}

/* ═══ tela grande: o dia à esquerda, o painel de decisões à direita ═══ */
@media (min-width:900px){
  .app{max-width:1120px;padding:0 32px 60px}
  .tabs{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--linha);padding:10px 0}
  .tabs-int,.tabs-int.cinco{max-width:1120px;padding:0 32px;
    grid-template-columns:repeat(5,minmax(0,132px));justify-content:start;gap:6px}
  .tabs-int.cinco .tab{font-size:13px;padding:9px 12px;text-align:center}
  .topo{padding:26px 0 14px}
  .titulo{font-size:36px}
  body{padding-top:57px}

  /* No PC a coluna da direita é o painel do dia e não some ao trocar de aba:
     sobra largura pra ela, e é a informação que você quer sempre à mão.
     No celular não cabe, então continua uma tela por vez. */
  .telas{display:grid;align-items:start;
    grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);column-gap:36px}
  #tela-hoje:not([hidden]){display:contents}
  #tela-hoje[hidden]{display:contents!important}   /* mantém a lateral viva */
  #tela-hoje[hidden] .col-principal{display:none}
  .col-principal,.col-lateral{display:block;min-width:0;grid-row:1}
  .col-principal{grid-column:1}
  .col-lateral{grid-column:2}
  #tela-semana,#tela-pilha,#tela-habitos,#tela-diario{grid-column:1;grid-row:1;min-width:0}
  #tela-hoje .fita-bloco{margin-top:2px}
  .fita{height:52px}
  .item{grid-template-columns:56px 16px 1fr 28px;padding:10px 0}
  .item-titulo{font-size:15.5px}
  #tela-hoje .legenda{margin-top:20px}
  /* a Semana em duas colunas de cartões */
  #tela-semana{column-count:2;column-gap:26px}
  #tela-semana>*{break-inside:avoid}
  #tela-semana .sec-titulo,#tela-semana .sec-sub{column-span:all}
  .dia-card{display:inline-block;width:100%}
  /* folhas viram diálogo centrado, não gaveta */
  .sheet-bg{align-items:center;padding:24px}
  .sheet{max-width:520px;border-radius:18px;max-height:88vh;
    padding:24px 24px 22px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
  .sheet .acoes{flex-direction:row;flex-wrap:wrap}
  .sheet .acoes .bt{flex:1;min-width:150px}
  .pilha-form input,.sheet input,.sheet select{font-size:15px}
  #tela-pilha,#tela-habitos,#tela-diario{max-width:780px}
}
@media (min-width:1280px){
  .app{max-width:1240px}
  .tabs-int,.tabs-int.cinco{max-width:1240px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
